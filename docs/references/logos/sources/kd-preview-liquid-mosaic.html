<style>
  #kd-preview-liquid { color-scheme: light dark; }
  #kd-preview-liquid .lp-board {
    --lp-stage: light-dark(#edf2f6,#1e2630); --lp-text: light-dark(#24394b,#e9f0f7);
    --lp-muted: light-dark(#53687b,#b1c2d2); --lp-rule: light-dark(#cfdbe5,#3d4d5d);
    padding: 24px 28px; border-radius: 22px; background: var(--lp-stage); color: var(--lp-text);
    font: 14px/1.5 ui-sans-serif,system-ui,sans-serif; box-sizing: border-box;
  }
  #kd-preview-liquid .lp-heading { padding-right: 90px; min-height: 60px; }
  #kd-preview-liquid h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.025em; }
  #kd-preview-liquid .lp-subtitle { color: var(--lp-muted); font-size: 12px; margin-top: 4px; }
  #kd-preview-liquid .lp-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 26px 0 24px; }
  #kd-preview-liquid figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  #kd-preview-liquid figcaption { font-size: 12px; color: var(--lp-muted); }
  #kd-preview-liquid .lp-icon {
    --lp-base: #fff; --lp-glyph: #252525; --lp-halo: #ffffffb8;
    --lp-metal-a: #c4d1d9; --lp-metal-b: #7e929f; --lp-metal-c: #364c5b;
    --lp-edge: #1a1a1a55; --lp-tint: .075;
    width: 1em; height: 1em; font-size: 200px; position: relative; overflow: hidden;
    background: var(--lp-base); isolation: isolate; flex: 0 0 auto;
  }
  #kd-preview-liquid .lp-icon[data-mode="dark"] {
    --lp-base: #1a1a1a; --lp-glyph: #edf4f4; --lp-halo: #1a1a1aa6;
    --lp-metal-a: #fff; --lp-metal-b: #cbd8e0; --lp-metal-c: #8597a4;
    --lp-edge: #ffffff77;
  }
  #kd-preview-liquid .lp-icon *, #kd-preview-liquid .lp-icon *::before, #kd-preview-liquid .lp-icon *::after { box-sizing: border-box; }
  #kd-preview-liquid .lp-mosaic-layer { position: absolute; inset: 0; background: var(--lp-base); overflow: hidden; }
  #kd-preview-liquid .lp-grid {
    position: absolute; left: 50%; top: 50%; width: 136%; height: 136%;
    transform: translate(-50%,-50%) rotate(-24deg); display: flex; flex-direction: column; gap: .018em;
  }
  #kd-preview-liquid .lp-masonry-row {
    display: flex; gap: .018em; flex: var(--lp-row-weight,1) 1 0; min-height: 0;
  }
  #kd-preview-liquid .lp-cell {
    display: grid; place-items: center; flex: var(--lp-tile-weight,1) 1 0;
    min-width: 0; min-height: 0; border-radius: .025em;
    background: color-mix(in srgb,var(--lp-file-color) 23%,var(--lp-base));
    color: color-mix(in srgb,var(--lp-file-color) 84%,var(--lp-base));
    filter: saturate(1.25);
  }
  /* Override the host's fixed icon size so symbols scale with each logo. */
  #kd-preview-liquid .lp-cell svg { width: min(72%,.24em) !important; height: min(72%,.24em) !important; stroke-width: 1.55; }
  #kd-preview-liquid [data-mode="dark"] .lp-cell {
    background: color-mix(in srgb,var(--lp-file-color) 17%,var(--lp-base));
    color: color-mix(in srgb,var(--lp-file-color) 66%,#e8eeee);
    filter: none;
  }
  #kd-preview-liquid .lp-lens-only .lp-base-mosaic { clip-path: circle(40.7% at 50% 50%); }
  #kd-preview-liquid .lp-refraction-window { position: absolute; inset: 0; clip-path: circle(40.7% at 50% 50%); z-index: 1; }
  #kd-preview-liquid .lp-wordmark { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  #kd-preview-liquid .lp-glass {
    position: absolute; left: 9.3%; top: 9.3%; width: 81.4%; height: 81.4%; border-radius: 50%;
    z-index: 3; background: rgb(43 205 189 / var(--lp-tint));
    box-shadow: inset .009em .009em .018em #ffffff6b, inset -.008em -.008em .016em #27665833;
    pointer-events: none;
  }
  #kd-preview-liquid .lp-glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg,#ffffff2b 0%,#ffffff05 28%,transparent 42% 72%,#c6fff51a 100%);
  }
  #kd-preview-liquid [data-mode="dark"] .lp-glass {
    background: rgb(14 87 83 / calc(var(--lp-tint) + .06));
  }
  #kd-preview-liquid .lp-glass::after {
    content: ''; position: absolute; inset: 2%; border-radius: inherit;
    border: .005em solid transparent; border-top-color: #ffffff9e; border-left-color: #ffffff45;
    transform: rotate(-20deg);
  }
  #kd-preview-liquid .lp-frame {
    position: absolute; left: 8.5%; top: 8.5%; width: 83%; height: 83%; border-radius: 50%; z-index: 5;
    background: conic-gradient(from -40deg,var(--lp-metal-a),var(--lp-metal-b) 16%,var(--lp-metal-c) 27%,var(--lp-metal-a) 43%,var(--lp-metal-b) 59%,var(--lp-metal-c) 74%,var(--lp-metal-a) 90%);
    mask: radial-gradient(farthest-side,transparent calc(100% - .038em),#000 calc(100% - .036em));
    filter: drop-shadow(.002em .002em 0 var(--lp-edge)); pointer-events: none;
  }
  #kd-preview-liquid .lp-handle {
    position: absolute; left: 70.5%; top: 77.5%; width: 14%; height: 35%; border-radius: .035em;
    transform: rotate(-45deg); transform-origin: center top; z-index: 4;
    background: linear-gradient(90deg,var(--lp-metal-c),var(--lp-metal-a) 20%,var(--lp-metal-b) 42% 74%,var(--lp-metal-c));
    box-shadow: inset .004em 0 0 #fff9, .002em .002em 0 var(--lp-edge);
  }
  #kd-preview-liquid .lp-handle::before {
    content: ''; position: absolute; left: -12%; top: 0; width: 124%; height: 12%; border-radius: .008em;
    background: linear-gradient(90deg,var(--lp-metal-c),var(--lp-metal-a) 35%,var(--lp-metal-b));
  }
  #kd-preview-liquid .lp-crops { display: grid; grid-template-columns: 88px 1fr 1fr; gap: 12px; align-items: center; border-top: 1px solid var(--lp-rule); padding-top: 20px; }
  #kd-preview-liquid .lp-crops > span { color: var(--lp-muted); font-size: 12px; }
  #kd-preview-liquid .lp-crop-slot { display: flex; justify-content: center; }
  #kd-preview-liquid .lp-crop-slot .lp-icon { font-size: 56px; }
  #kd-preview-liquid .lp-mask-squircle { clip-path: polygon(0% 30%,.4% 20%,1.5% 12%,4% 6%,8% 2.5%,15% .5%,30% 0%,70% 0%,85% .5%,92% 2.5%,96% 6%,98.5% 12%,99.6% 20%,100% 30%,100% 70%,99.6% 80%,98.5% 88%,96% 94%,92% 97.5%,85% 99.5%,70% 100%,30% 100%,15% 99.5%,8% 97.5%,4% 94%,1.5% 88%,.4% 80%,0% 70%); }
  #kd-preview-liquid .lp-mask-rounded { clip-path: inset(0 round 22%); }
  #kd-preview-liquid .lp-mask-circle { clip-path: circle(50%); }
  #kd-preview-liquid .lp-count { margin-top: 20px; color: var(--lp-muted); font-size: 12px; }
  @media(max-width:480px) {
    #kd-preview-liquid .lp-board { padding: 22px 16px; }
    #kd-preview-liquid .lp-heading { min-height: 110px; }
    #kd-preview-liquid .lp-pair { gap: 16px; }
    #kd-preview-liquid .lp-pair .lp-icon { font-size: min(160px,33vw); }
    #kd-preview-liquid .lp-crops { grid-template-columns: 76px 1fr 1fr; gap: 12px 6px; }
    #kd-preview-liquid .lp-crop-slot .lp-icon { font-size: 48px; }
  }
</style>
<div id="kd-preview-liquid" aria-label="KD Preview liquid-glass logo">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
    <defs>
      <filter id="lp-liquid-template" x="0" y="0" width="1" height="1" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="lens-map"></feImage>
        <feDisplacementMap in="SourceGraphic" in2="lens-map" scale=".12" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
    </defs>
  </svg>
  <div class="viz-carousel viz-dotted-background" aria-label="KD Preview mosaic coverage variants">
  <section data-variant="Lens-only mosaic" aria-label="Lens-only mosaic KD Preview logo"></section>
  <section data-variant="Full mosaic" aria-label="Full mosaic KD Preview logo" hidden>
  <div class="lp-board">
    <header class="lp-heading"><h2>Full mosaic</h2><div class="lp-subtitle">KD Preview · edge-to-edge masonry</div></header>
    <div class="lp-pair">
      <figure><div class="lp-icon" data-mode="light" role="img" aria-label="Light KD Preview logo: an irregular diagonal masonry mosaic extending beyond the icon edges, with large file-type symbols beneath a silver looking glass with a thicker frame and handle, centered sharp KD lettering and an aqua-tinted lens">
        <div class="lp-mosaic-layer lp-base-mosaic"><div class="lp-grid"></div></div>
        <div class="lp-refraction-window"><div class="lp-mosaic-layer"><div class="lp-grid"></div></div></div>
        <canvas class="lp-wordmark" width="600" height="600" aria-hidden="true"></canvas>
        <div class="lp-glass"></div><div class="lp-handle"></div><div class="lp-frame"></div>
      </div><figcaption>Light</figcaption></figure>
      <figure><div class="lp-icon" data-mode="dark" role="img" aria-label="Dark KD Preview logo with the same mosaic, sharp KD lettering, thicker silver frame and handle, and aqua glass"></div><figcaption>Dark</figcaption></figure>
    </div>
    <div class="lp-crops" aria-label="Icon crop previews"></div>
    <div class="lp-count" aria-live="polite"></div>
  </div>
  </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('kd-preview-liquid');
  const state = { items: 23, refraction: 110, tint: 10 };
  const files = [
    { name: 'Images', icon: 'image', color: '#bd8e57' },
    { name: 'Text', icon: 'align-left', color: '#7797b5' },
    { name: 'Audio', icon: 'music-2', color: '#ac86b9' },
    { name: 'Archives', icon: 'file-archive', color: '#bba05d' },
    { name: 'PDF documents', icon: 'file-image', color: '#bd817e' },
    { name: 'Spreadsheets', icon: 'table-2', color: '#6fa58f' },
    { name: 'Video', icon: 'film', color: '#6d9eaa' },
  ];
  // The exact outlined KD geometry used by the shipped Paint logo (29.6 × 16
  // in the same 100-unit square); it stays entirely outside the refraction filter.
  const wordmark = new Path2D(
    'M0,0H3.6V6.2L8.8,0H13.3L6.9,7.4L13.8,16H9.2L3.6,9V16H0Z' +
    'M14.5,0H20.6C26.1,0 29.6,3 29.6,8C29.6,13 26.1,16 20.6,16H14.5Z' +
    'M18.1,3.3V12.7H20.4C23.9,12.7 25.8,11.1 25.8,8C25.8,4.9 23.9,3.3 20.4,3.3Z'
  );
  function restore(saved) {
    if (!saved) return;
    if (Number.isFinite(saved.items)) state.items = Math.max(0,Math.min(25,Math.round(saved.items)));
    if (Number.isFinite(saved.refraction)) state.refraction = Math.max(0,Math.min(160,saved.refraction));
    if (Number.isFinite(saved.tint)) state.tint = Math.max(0,Math.min(16,saved.tint));
  }
  restore(window.openai?.widgetState?.privateContent);
  const lensBoard = root.querySelector('.lp-board').cloneNode(true);
  lensBoard.classList.add('lp-lens-only');
  lensBoard.querySelector('h2').textContent = 'Lens-only mosaic';
  lensBoard.querySelector('.lp-subtitle').textContent = 'KD Preview · file mosaic inside the glass';
  root.querySelector('[data-variant="Lens-only mosaic"]').appendChild(lensBoard);
  root.querySelectorAll('.lp-board').forEach(board => {
    const original = board.querySelector('.lp-pair [data-mode="light"]');
    board.querySelector('.lp-pair [data-mode="dark"]').innerHTML = original.innerHTML;
    if (board.classList.contains('lp-lens-only')) {
      board.querySelectorAll('.lp-pair .lp-icon').forEach(icon => {
        icon.setAttribute('aria-label', 'KD Preview, ' + icon.dataset.mode + ': file mosaic clipped inside the looking glass, flat neutral background outside, centered sharp KD and a thick silver rim and handle');
      });
    }
    const crops = board.querySelector('.lp-crops');
    [['Squircle','squircle'],['Rounded','rounded'],['Circle','circle']].forEach(([label,mask]) => {
      const name = document.createElement('span'); name.textContent = label; crops.appendChild(name);
      ['light','dark'].forEach(mode => {
        const slot = document.createElement('div'); slot.className = 'lp-crop-slot';
        const copy = original.cloneNode(true); copy.dataset.mode = mode; copy.classList.add('lp-mask-' + mask);
        copy.setAttribute('aria-label', board.querySelector('h2').textContent + ', ' + mode + ', ' + label + ' crop');
        slot.appendChild(copy); crops.appendChild(slot);
      });
    });
  });
  const icons = [...root.querySelectorAll('.lp-icon')];
  const filterTemplate = root.querySelector('#lp-liquid-template');
  const opticalFilters = icons.map((icon,index) => {
    const filter = filterTemplate.cloneNode(true); filter.id = 'lp-liquid-optics-' + index;
    filterTemplate.parentNode.appendChild(filter);
    icon.querySelector('.lp-refraction-window .lp-mosaic-layer').style.filter = 'url(#' + filter.id + ')';
    return { icon, filter };
  });
  let previousItems = -1;
  function drawWordmarks() {
    icons.forEach(icon => {
      const canvas = icon.querySelector('.lp-wordmark');
      const size = icon.getBoundingClientRect().width || parseFloat(getComputedStyle(icon).fontSize);
      canvas.width = canvas.height = Math.max(600,Math.round(size*devicePixelRatio));
      const ctx = canvas.getContext('2d');
      const style = getComputedStyle(icon);
      ctx.setTransform(canvas.width/100,0,0,canvas.height/100,0,0); ctx.clearRect(0,0,100,100);
      ctx.save(); ctx.translate(35.2,42);
      ctx.strokeStyle = style.getPropertyValue('--lp-halo').trim();
      ctx.lineWidth = .36; ctx.lineJoin = 'round'; ctx.stroke(wordmark);
      ctx.fillStyle = style.getPropertyValue('--lp-glyph').trim(); ctx.fill(wordmark,'evenodd');
      ctx.restore();
    });
  }
  // Independently implemented radial optics, informed by the JS-generated
  // displacement-map approach in https://github.com/jbbixler/liquid-glass.
  // Only the mosaic copy is displaced. A separate tint then covers mosaic + KD.
  function makeOpticalMap() {
    const size = 512;
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d'); const image = ctx.createImageData(size,size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const dx = (x+.5)/size-.5, dy = (y+.5)/size-.5;
        const radius = Math.hypot(dx,dy), edge = .407-radius;
        // A curved outer band bends most; a small central lens component
        // magnifies the mosaic continuously without a frosted/blurred center.
        const rim = edge >= 0 ? Math.pow(Math.max(0,1-edge/.13),2) : 0;
        const lens = edge >= 0 ? .12*Math.min(radius/.407,1) : 0;
        const bend = Math.min(.98,.92*rim+lens), index = (y*size+x)*4;
        image.data[index] = 127.5-(radius ? dx/radius : 0)*127.5*bend;
        image.data[index+1] = 127.5-(radius ? dy/radius : 0)*127.5*bend;
        image.data[index+2] = 128; image.data[index+3] = 255;
      }
    }
    ctx.putImageData(image,0,0);
    const map = canvas.toDataURL();
    opticalFilters.forEach(({ filter }) => filter.querySelector('feImage').setAttribute('href',map));
  }
  function resizeOptics() {
    opticalFilters.forEach(({ icon,filter }) => {
      const size = icon.getBoundingClientRect().width || parseFloat(getComputedStyle(icon).fontSize);
      filter.setAttribute('width',size); filter.setAttribute('height',size);
      const image = filter.querySelector('feImage'); image.setAttribute('width',size); image.setAttribute('height',size);
      filter.querySelector('feDisplacementMap').setAttribute('scale',size*.12*state.refraction/100);
    });
  }
  function renderMosaic() {
    if (previousItems === state.items) return;
    previousItems = state.items;
    root.querySelectorAll('.lp-grid').forEach(grid => {
      grid.replaceChildren();
      const rows = Math.max(1,Math.round(Math.sqrt(state.items)));
      const widths = [1.34,.83,1.15,.96,1.48,.79,1.11];
      const heights = [1.08,.91,1.16,.97,1.04];
      let index = 0;
      for (let rowIndex = 0; rowIndex < rows && index < state.items; rowIndex++) {
        const row = document.createElement('div'); row.className = 'lp-masonry-row';
        row.style.setProperty('--lp-row-weight',heights[rowIndex%heights.length]);
        const cells = Math.floor(state.items/rows)+(rowIndex < state.items%rows ? 1 : 0);
        for (let column = 0; column < cells; column++,index++) {
          const file = files[index%files.length];
          const tile = document.createElement('div'); tile.className = 'lp-cell';
          tile.dataset.fileType = file.name; tile.style.setProperty('--lp-file-color',file.color);
          tile.style.setProperty('--lp-tile-weight',widths[(column+rowIndex*3)%widths.length]);
          const glyph = document.createElement('i'); glyph.dataset.lucide = file.icon; glyph.setAttribute('aria-hidden','true');
          tile.appendChild(glyph); row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    });
    globalThis.lucide?.createIcons({ attrs: { 'aria-hidden': 'true' } });
  }
  function render() {
    renderMosaic();
    icons.forEach(icon => icon.style.setProperty('--lp-tint',state.tint/100));
    resizeOptics();
    root.querySelectorAll('.lp-count').forEach(label => { label.textContent = state.items + ' mosaic items'; });
  }
  function changed() {
    render();
    window.openai?.setWidgetState?.({ privateContent: { ...state }, modelContent: { gridItems: state.items, refractionPercent: state.refraction, aquaTintPercent: state.tint } }).catch(() => {});
  }
  makeOpticalMap(); drawWordmarks(); render();
  const resizeObserver = new ResizeObserver(() => { resizeOptics(); drawWordmarks(); });
  icons.forEach(icon => resizeObserver.observe(icon));
  window.addEventListener('openai:set_globals',event => {
    restore(event.detail?.globals?.widgetState?.privateContent); render();
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: changed });
    tweak.addSlider(state,'items',{ label: 'Visible grid items', min: 0, max: 25, step: 1 });
    tweak.addSlider(state,'refraction',{ label: 'Glass refraction', min: 0, max: 160, step: 5, unit: '%' });
    tweak.addSlider(state,'tint',{ label: 'Aqua tint', min: 0, max: 16, step: .5, unit: '%' });
  }
})();
</script>
