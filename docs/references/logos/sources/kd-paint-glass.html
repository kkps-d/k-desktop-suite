<style>
  #kd-paint-glass-refinements { color-scheme: light dark; }
  #kd-paint-glass-refinements .paint-board {
    --study-bg: light-dark(#edf1f3,#23292c); --study-text: light-dark(#203c40,#e5efed);
    --study-muted: light-dark(#52676a,#b6c8c6); --study-rule: light-dark(#ced9da,#405352);
    color: var(--study-text); background: var(--study-bg); border-radius: 22px;
    padding: 24px 28px; box-sizing: border-box; font: 14px/1.5 ui-sans-serif,system-ui,sans-serif;
  }
  #kd-paint-glass-refinements .paint-heading { min-height: 58px; padding-right: 90px; }
  #kd-paint-glass-refinements h2 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.025em; }
  #kd-paint-glass-refinements .paint-subtitle { margin-top: 3px; color: var(--study-muted); font-size: 12px; }
  #kd-paint-glass-refinements .paint-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 20px 0 24px; }
  #kd-paint-glass-refinements figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  #kd-paint-glass-refinements figcaption, #kd-paint-glass-refinements .paint-crops > span { font-size: 12px; color: var(--study-muted); }
  #kd-paint-glass-refinements .paint-icon { display: block; width: min(100%,240px); height: auto; aspect-ratio: 1; background: #fff; }
  #kd-paint-glass-refinements .paint-icon[data-mode="dark"] { background: #1a1a1a; }
  #kd-paint-glass-refinements .paint-crops { display: grid; grid-template-columns: 108px 1fr 1fr; align-items: center; gap: 14px 12px; padding-top: 20px; border-top: 1px solid var(--study-rule); }
  #kd-paint-glass-refinements .paint-slot { display: flex; justify-content: center; }
  #kd-paint-glass-refinements .paint-slot .paint-icon { width: 72px; }
  #kd-paint-glass-refinements .paint-squircle { clip-path: polygon(0% 30%,.4% 20%,1.5% 12%,4% 6%,8% 2.5%,15% .5%,30% 0%,70% 0%,85% .5%,92% 2.5%,96% 6%,98.5% 12%,99.6% 20%,100% 30%,100% 70%,99.6% 80%,98.5% 88%,96% 94%,92% 97.5%,85% 99.5%,70% 100%,30% 100%,15% 99.5%,8% 97.5%,4% 94%,1.5% 88%,.4% 80%,0% 70%); }
  #kd-paint-glass-refinements .paint-rounded { clip-path: inset(0 round 22%); }
  #kd-paint-glass-refinements .paint-circle { clip-path: circle(50%); }
  @media (max-width:480px) {
    #kd-paint-glass-refinements .paint-board { padding: 22px 16px; }
    #kd-paint-glass-refinements .paint-heading { min-height: 88px; }
    #kd-paint-glass-refinements .paint-pair { gap: 14px; }
    #kd-paint-glass-refinements .paint-crops { grid-template-columns: 100px 1fr 1fr; gap: 12px 6px; }
    #kd-paint-glass-refinements .paint-slot .paint-icon { width: 48px; }
  }
</style>
<div id="kd-paint-glass-refinements" aria-label="KD Paint original glass cup refinements">
  <div class="viz-carousel viz-dotted-background" aria-label="Original cup rim and handle refinements">
    <section data-variant="Rolled rim" aria-label="Original cup with a rolled lip and rounder handle roots">
      <div class="paint-board" data-style="rolled" aria-label="Rolled rim">
        <header class="paint-heading"><h2>Rolled rim</h2><div class="paint-subtitle">Rounded lip · cushioned handle joins</div></header>
        <div class="paint-pair">
          <figure><canvas class="paint-icon" width="1024" height="1024" data-mode="light" role="img" aria-label="Light KD Paint: original glass cup with a rounded lip, softly flared handle roots, original colored tools and etched KD">Rolled rim, light.</canvas><figcaption>Light · white</figcaption></figure>
          <figure><canvas class="paint-icon" width="1024" height="1024" data-mode="dark" role="img" aria-label="Dark KD Paint: original cup with a rolled rim and round handle joins on a flat dark background">Rolled rim, dark.</canvas><figcaption>Dark · #1a1a1a</figcaption></figure>
        </div>
        <div class="paint-crops" aria-label="Rolled rim light and dark crop previews"></div>
      </div>
    </section>
    <section data-variant="Soft joins" aria-label="Original cup with a shallow rim and inset handle roots" hidden>
      <div class="paint-board" data-style="soft" aria-label="Soft joins">
        <header class="paint-heading"><h2>Soft joins</h2><div class="paint-subtitle">Shallow rim · inset handle roots</div></header>
        <div class="paint-pair">
          <figure><canvas class="paint-icon" width="1024" height="1024" data-mode="light" role="img" aria-label="Light KD Paint: original glass cup with a subtly bowed rim and inset handle joins, original colored tools and etched KD">Soft joins, light.</canvas><figcaption>Light · white</figcaption></figure>
          <figure><canvas class="paint-icon" width="1024" height="1024" data-mode="dark" role="img" aria-label="Dark KD Paint: original glass cup with soft handle joins on a flat dark background">Soft joins, dark.</canvas><figcaption>Dark · #1a1a1a</figcaption></figure>
        </div>
        <div class="paint-crops" aria-label="Soft joins light and dark crop previews"></div>
      </div>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('kd-paint-glass-refinements');
  const defaults = { tint: '#29b99d', density: 34, reflections: 80, refraction: 35 };
  const labels = { soft: 'Soft joins', rolled: 'Rolled rim' };
  const states = { soft: { ...defaults }, rolled: { ...defaults } };
  const boards = Array.from(root.querySelectorAll('.paint-board'));
  function restore(saved) {
    for (const key of Object.keys(states)) {
      const values = saved?.[key];
      if (/^#[0-9a-f]{6}$/i.test(values?.tint || '')) states[key].tint = values.tint;
      for (const [name,min,max] of [['density',20,60],['reflections',15,80],['refraction',0,70]]) {
        if (Number.isFinite(values?.[name])) states[key][name] = Math.max(min,Math.min(max,values[name]));
      }
    }
  }
  restore(window.openai?.widgetState?.privateContent);
  for (const board of boards) {
    const crops = board.querySelector('.paint-crops');
    for (const [name,mask] of [['Squircle','squircle'],['Rounded square','rounded'],['Circle','circle']]) {
      const label = document.createElement('span'); label.textContent = name; crops.appendChild(label);
      for (const mode of ['light','dark']) {
        const slot = document.createElement('div'); slot.className = 'paint-slot';
        const icon = document.createElement('canvas'); icon.width = 600; icon.height = 600;
        icon.className = 'paint-icon paint-' + mask; icon.dataset.mode = mode;
        icon.setAttribute('role','img'); icon.setAttribute('aria-label',`${labels[board.dataset.style]}, ${mode}, ${name} crop`);
        slot.appendChild(icon); crops.appendChild(slot);
      }
    }
  }
  const wordmark = new Path2D('M0,0H3.6V6.2L8.8,0H13.3L6.9,7.4L13.8,16H9.2L3.6,9V16H0ZM14.5,0H20.6C26.1,0 29.6,3 29.6,8C29.6,13 26.1,16 20.6,16H14.5ZM18.1,3.3V12.7H20.4C23.9,12.7 25.8,11.1 25.8,8C25.8,4.9 23.9,3.3 20.4,3.3Z');
  function paint(canvas,state,shape) {
    const ctx = canvas.getContext('2d');
    const dark = canvas.dataset.mode === 'dark';
    const density = state.density / 100, shine = state.reflections / 100;
    const rgb = state.tint.match(/[a-f0-9]{2}/ig).map(v => parseInt(v,16));
    const tint = alpha => `rgba(${rgb.join(',')},${alpha})`;
    const outline = dark ? '#ffffff70' : '#1a1a1a66';
    const p = dark ? {
      gold:'#f9c14e', goldLight:'#ffe293', goldDark:'#dda739', goldEdge:'#d49b2e', woodTip:'#f0d2a6',
      wood:'#c88b52', woodLight:'#e0ad79', woodDark:'#a36b3f', woodEdge:'#945b31', bristle:'#9b7656', bristleEdge:'#79583d',
      purple:'#b896e8', purpleLight:'#d4bcf2', purpleDark:'#9670cb', purpleEdge:'#8d62c4', metal:'#dbe4ed', metalLight:'#ffffff', metalDark:'#acbac5'
    } : {
      gold:'#f2b12f', goldLight:'#ffdc7d', goldDark:'#ce901f', goldEdge:'#c7891f', woodTip:'#efd5ac',
      wood:'#a2673b', woodLight:'#c78f5b', woodDark:'#7a4b2d', woodEdge:'#704226', bristle:'#70513b', bristleEdge:'#513927',
      purple:'#9870ce', purpleLight:'#b899e5', purpleDark:'#7852ad', purpleEdge:'#6c479f', metal:'#c4d5e2', metalLight:'#f8fbfd', metalDark:'#94a3af'
    };
    const gradient = (x1,y1,x2,y2,stops) => {
      const g = ctx.createLinearGradient(x1,y1,x2,y2);
      for (const [at,color] of stops) g.addColorStop(at,color);
      return g;
    };
    const rectangle = (x,y,w,h,r=0) => { const path = new Path2D(); path.roundRect(x,y,w,h,r); return path; };
    const rotate = (angle,x,y) => { ctx.translate(x,y); ctx.rotate(angle*Math.PI/180); ctx.translate(-x,-y); };
    function solid(path,fill,stroke=outline,width=.3) {
      ctx.fillStyle = fill; ctx.fill(path); ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(path);
    }
    function glass(path,x,y,w,h) {
      ctx.fillStyle = gradient(x,y,x+w,y+h,[[0,`rgba(37,129,185,${density+.09})`],[.48,tint(density+.02)],[1,`rgba(63,196,118,${density+.10})`]]);
      ctx.fill(path,'evenodd');
      ctx.save(); ctx.clip(path,'evenodd');
      ctx.fillStyle = gradient(x,y,x+w,y,[[0,'#0d6a7c55'],[.05,'#5bd3df17'],[.16,'#ffffff00'],[.85,'#ffffff00'],[1,'#0f765844']]); ctx.fillRect(x,y,w,h);
      ctx.fillStyle = gradient(x,y,x+w*.8,y+h,[[0,`rgba(245,255,255,${shine*.34})`],[.3,`rgba(245,255,255,${shine*.09})`],[.65,'#ffffff00'],[1,'#ffffff00']]); ctx.fillRect(x,y,w,h);
      ctx.translate(.18,.22); ctx.strokeStyle = `rgba(236,255,255,${shine+.12})`; ctx.lineWidth = .42; ctx.stroke(path); ctx.restore();
      ctx.strokeStyle = dark ? '#9ee8dd80' : '#267f8566'; ctx.lineWidth = .3; ctx.stroke(path);
      ctx.save(); ctx.clip(path,'evenodd'); ctx.translate(-.18,-.22);
      ctx.strokeStyle = `rgba(198,255,235,${shine*.70})`; ctx.lineWidth = .38; ctx.stroke(path); ctx.restore();
    }
    ctx.setTransform(canvas.width/100,0,0,canvas.height/100,0,0);
    ctx.fillStyle = dark ? '#1a1a1a' : '#ffffff'; ctx.fillRect(0,0,100,100);
    ctx.save(); ctx.translate(48,50); ctx.scale(.94,.94); ctx.translate(-50,-50);
    // Keep the original 48-by-35 cup body, bottom corners, tools and KD placement.
    // Only the lip's shallow bow and the handle roots vary across these studies.
    const profiles = {
      soft: {
        front: 'M26 50C26 50.7 36.75 51.2 50 51.2S74 50.7 74 50V77.5Q74 85 66.5 85H33.5Q26 85 26 77.5Z',
        lip: 'M26 50C26 50.7 36.75 51.2 50 51.2S74 50.7 74 50',
        handle: 'M73 55H76.2Q85 55 85 63.8V69Q85 77.5 76.2 77.5H73V73.7H76.2Q81 73.7 81 69V63.8Q81 59 76.2 59H73Z',
        rear: 'M26 50C26 49.3 36.75 48.8 50 48.8S74 49.3 74 50'
      },
      rolled: {
        front: 'M26 50C26 51 36.75 51.7 50 51.7S74 51 74 50V77.5Q74 85 66.5 85H33.5Q26 85 26 77.5Z',
        lip: 'M26 50C26 51 36.75 51.7 50 51.7S74 51 74 50',
        handle: 'M72.8 54.5Q74 55 76.5 55Q85 55 85 63.5V69Q85 78 76.5 78Q74 78 72.8 78.5V73Q74.4 73.9 76.5 73.9Q81 73.9 81 69V63.5Q81 59.1 76.5 59.1Q74.4 59.1 72.8 60Z',
        rear: 'M26 50C26 49 36.75 48.3 50 48.3S74 49 74 50'
      }
    };
    const profile = profiles[shape];
    const body = new Path2D('M26 50H74V77.5Q74 85 66.5 85H33.5Q26 85 26 77.5Z');
    const front = new Path2D(profile.front);
    if (profile.handle) {
      // Hide the handle's inner attachment bar behind the body, retaining the loop.
      ctx.save(); ctx.beginPath(); ctx.rect(74,0,26,100); ctx.clip();
      glass(new Path2D(profile.handle),73,54.5,12,24); ctx.restore();
    }
    ctx.fillStyle = tint(.10); ctx.fill(body);
    // Mirror the front lip about y=50 so front and rear share the same curvature.
    const rim = new Path2D(profile.rear);
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,100,50); ctx.clip();
    ctx.fillStyle = gradient(26,45,74,55,[[0,'#2581b929'],[1,tint(.16)]]); ctx.fill(rim);
    ctx.strokeStyle = dark ? '#aff4e9aa' : '#4c92948c'; ctx.lineWidth = shape === 'rolled' ? .7 : .35; ctx.stroke(rim);
    if (shape === 'rolled') {
      const innerRear = new Path2D('M26.9 50C26.9 49.45 37.15 49 50 49S73.1 49.45 73.1 50');
      ctx.strokeStyle = `rgba(235,255,250,${shine*.5})`; ctx.lineWidth = .3; ctx.stroke(innerRear);
    }
    ctx.restore();

    // Original tool positions are retained. Their previously hidden ends now
    // reach the cup base so the transparent vessel reveals believable contents.
    ctx.save(); rotate(-10,40,61);
    const pencil = rectangle(35,28,10,52);
    solid(pencil,gradient(35,28,45,28,[[0,p.goldLight],[.24,p.goldLight],[.24,p.gold],[.75,p.gold],[1,p.goldDark]]));
    ctx.fillStyle = p.goldEdge; ctx.fillRect(35,28,2.5,52);
    solid(new Path2D('M40 18L45 28H35Z'),p.woodTip);
    // The graphite occupies the upper half of the wooden tip, sharing its sides.
    solid(new Path2D('M40 18L42.5 23H37.5Z'),'#3a4652'); ctx.restore();

    ctx.save(); rotate(3,51.5,61);
    const brush = rectangle(48,27,7,53,[0,0,2,2]);
    solid(brush,gradient(48,27,55,27,[[0,p.woodLight],[.25,p.woodLight],[.25,p.wood],[.75,p.wood],[1,p.woodDark]]));
    ctx.strokeStyle = p.woodEdge; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(48.6,28); ctx.lineTo(48.6,79); ctx.stroke();
    const bristles = new Path2D('M52.97 9L54.884 12.6L55.928 17L56.45 21.8L56.015 25.8L55.058 29H49.142L48.185 25.8L47.75 21.8L48.272 17L49.664 12.2Z');
    solid(bristles,p.bristle); ctx.save(); ctx.clip(bristles);
    ctx.strokeStyle = p.bristleEdge; ctx.lineWidth = .5;
    for (const x of [49.2,51.9,54.6]) { ctx.beginPath(); ctx.moveTo(x,11); ctx.lineTo(x,29); ctx.stroke(); } ctx.restore();
    solid(rectangle(48.04,27,8.12,8.5),gradient(48.04,27,56.16,27,[[0,p.metalLight],[.24,p.metal],[.75,p.metal],[1,p.metalDark]]));
    ctx.restore();

    ctx.save(); rotate(13,63,61);
    const marker = rectangle(58,28,10,52,2.5);
    solid(marker,gradient(58,28,68,28,[[0,p.purpleLight],[.24,p.purple],[.75,p.purple],[1,p.purpleDark]]));
    solid(rectangle(58,28,10,10.23,[2.5,2.5,0,0]),gradient(58,28,68,28,[[0,p.purple],[.24,p.purpleEdge],[.75,p.purpleEdge],[1,p.purpleDark]]));
    ctx.fillStyle = p.purple; ctx.fill(rectangle(64.5,29.32,1.8,9,1)); ctx.restore();

    // Refract the real tools only where they sit behind the cup's front wall.
    ctx.save(); ctx.clip(front); ctx.setTransform(1,0,0,1,0,0);
    const offset = canvas.width/100 * .94 * state.refraction/100;
    ctx.drawImage(canvas,offset,offset*.3); ctx.restore();
    glass(front,26,50,48,35);
    ctx.strokeStyle = `rgba(242,255,255,${shine*.85})`; ctx.lineWidth = shape === 'rolled' ? .7 : .45; ctx.stroke(new Path2D(profile.lip));
    if (shape === 'rolled') {
      ctx.save(); ctx.translate(0,.7); ctx.strokeStyle = `rgba(198,255,235,${shine*.50})`; ctx.lineWidth = .3; ctx.stroke(new Path2D(profile.lip)); ctx.restore();
    }
    ctx.strokeStyle = `rgba(198,255,235,${shine*.70})`; ctx.lineWidth = .3;
    ctx.beginPath(); ctx.moveTo(27,78); ctx.quadraticCurveTo(27,84,33.5,84); ctx.lineTo(66.5,84); ctx.quadraticCurveTo(73,84,73,78); ctx.stroke();

    // Use Explorer's exact unfilled etched KD treatment and reflection linkage.
    ctx.save(); ctx.translate(35.2,59.15); ctx.lineJoin = 'round';
    ctx.strokeStyle = gradient(0,0,29.6,16,[[0,`rgba(34,94,102,${.32+shine*.16})`],[.55,'#286c734d'],[1,'#28796752']]);
    ctx.lineWidth = .38; ctx.stroke(wordmark);
    ctx.save(); ctx.translate(.10,.12);
    ctx.strokeStyle = gradient(0,0,29.6,16,[[0,`rgba(242,255,255,${shine*.70})`],[.45,`rgba(224,255,250,${shine*.25})`],[1,`rgba(198,255,235,${shine*.40})`]]);
    ctx.lineWidth = .35; ctx.stroke(wordmark); ctx.restore(); ctx.restore(); ctx.restore();
  }
  function render() {
    for (const board of boards) {
      for (const icon of board.querySelectorAll('canvas')) paint(icon,states[board.dataset.style],board.dataset.style);
    }
  }
  function changed() {
    render();
    window.openai?.setWidgetState?.({
      privateContent: { soft: { ...states.soft }, rolled: { ...states.rolled } },
      modelContent: { study: 'KD Paint retained Soft joins and Rolled rim; matching shallow front and rear rims', softJoins: { ...states.soft }, rolledRim: { ...states.rolled } }
    }).catch(() => {});
  }
  render();
  window.addEventListener('openai:set_globals',event => {
    const saved = event.detail?.globals?.widgetState?.privateContent;
    if (saved) { restore(saved); render(); }
  });
  if (globalThis.Tweak) for (const board of boards) {
    const tweak = new Tweak({ container: board, onChange: changed });
    const state = states[board.dataset.style];
    tweak.addColorPicker(state,'tint',{ label: 'Glass tint', reference: 'glass.tint' });
    tweak.addSlider(state,'density',{ label: 'Glass density', min: 20, max: 60, unit: '%', reference: 'glass.density' });
    tweak.addSlider(state,'reflections',{ label: 'Edge reflections', min: 15, max: 80, unit: '%', reference: 'glass.reflections' });
    tweak.addSlider(state,'refraction',{ label: 'Cup refraction', min: 0, max: 70, unit: '%', reference: 'glass.refraction' });
  }
})();
</script>
