<style>
  #kd-notepad-refinements { color-scheme: light dark; }
  #kd-notepad-refinements .kd-board {
    --kd-stage: light-dark(#edf2f6, #1e2630);
    --kd-text: light-dark(#24394b, #e9f0f7);
    --kd-muted: light-dark(#53687b, #b1c2d2);
    --kd-rule: light-dark(#cfdbe5, #3d4d5d);
    --kd-control: light-dark(#f9fbfd, #2a3745);
    --kd-size: 120px;
    color: var(--kd-text);
    background: var(--kd-stage);
    border-radius: 22px;
    padding: 24px 28px;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    box-sizing: border-box;
  }
  #kd-notepad-refinements .kd-logo {
    --kd-tile-surface: light-dark(#ffffff, #1a1a1a);
    --kd-outline-color: light-dark(rgb(26 26 26 / 45%), rgb(255 255 255 / 50%));
    --kd-outline-width: clamp(.35px, .005em, .75px);
    --kd-sheet: light-dark(#b9e0fa, #8dc7f0);
    --kd-cover: light-dark(#72b3e0, #4888b7);
    --kd-blue: light-dark(#80c3ef, #8bcbf5);
    --kd-blue-edge: light-dark(#438cbd, #5b9ed0);
    --kd-blue-ink: light-dark(#245d87, #123a58);
    --kd-cup: #ffffff;
    --kd-cup-edge: #ffffff;
    --kd-cup-inner: light-dark(#d4d4d4, #dedede);
    --kd-cup-ink: #252525;
    --kd-yellow: light-dark(#f2b12f, #f9c14e);
    --kd-yellow-edge: light-dark(#c7891f, #d49b2e);
    --kd-wood: light-dark(#efd5ac, #f0d2a6);
    --kd-graphite: #3a4652;
    --kd-brush-wood: light-dark(#a2673b, #c88b52);
    --kd-brush-wood-edge: light-dark(#704226, #945b31);
    --kd-bristle: light-dark(#70513b, #9b7656);
    --kd-bristle-edge: light-dark(#513927, #79583d);
    --kd-purple: light-dark(#9870ce, #b896e8);
    --kd-purple-edge: light-dark(#6c479f, #8d62c4);
    --kd-metal: light-dark(#c4d5e2, #dbe4ed);
  }
  #kd-notepad-refinements .kd-heading { padding-right: 76px; }
  #kd-notepad-refinements .kd-heading h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.025em; }
  #kd-notepad-refinements .kd-heading p { margin: 3px 0 0; color: var(--kd-muted); font-size: 12px; }
  #kd-notepad-refinements .kd-appearance { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; }
  #kd-notepad-refinements .kd-appearance label { font-size: 12px; color: var(--kd-muted); }
  #kd-notepad-refinements .kd-appearance select { color: var(--kd-text); background: var(--kd-control); border: 1px solid var(--kd-rule); border-radius: 10px; padding: 9px 32px 9px 12px; min-height: 44px; font: inherit; }
  #kd-notepad-refinements .kd-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 27px 0; }
  #kd-notepad-refinements .kd-app { display: flex; flex-direction: column; align-items: center; min-width: 0; gap: 17px; }
  #kd-notepad-refinements .kd-app h3 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -.025em; }
  #kd-notepad-refinements .kd-logo { width: 1em; height: 1em; position: relative; flex: 0 0 auto; font-size: var(--kd-size); overflow: hidden; }
  #kd-notepad-refinements .kd-logo *, #kd-notepad-refinements .kd-logo *::before, #kd-notepad-refinements .kd-logo *::after { position: absolute; box-sizing: border-box; }
  #kd-notepad-refinements .kd-tile { inset: 0; background: var(--kd-tile-surface); }
  #kd-notepad-refinements .kd-mask-squircle { clip-path: var(--kd-squircle-mask); }
  #kd-notepad-refinements .kd-mask-rounded { clip-path: inset(0 round 22%); }
  #kd-notepad-refinements .kd-mask-circle { clip-path: circle(50%); }
  /* Outline the composed silhouette, including clipped shapes and tool tips. */
  #kd-notepad-refinements .kd-art {
    inset: 0;
    filter:
      drop-shadow(var(--kd-outline-width) 0 0 var(--kd-outline-color))
      drop-shadow(calc(-1 * var(--kd-outline-width)) 0 0 var(--kd-outline-color))
      drop-shadow(0 var(--kd-outline-width) 0 var(--kd-outline-color))
      drop-shadow(0 calc(-1 * var(--kd-outline-width)) 0 var(--kd-outline-color));
  }
  #kd-notepad-refinements .kd-brand { display: flex; align-items: center; justify-content: center; }
  #kd-notepad-refinements .kd-brand span { position: static; font: 800 .23em/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.045em; }

  /* A blue cover and matching pen keep the printed-paper silhouette. */
  #kd-notepad-refinements .kd-notebook { left: 22%; top: 17%; width: 53%; height: 66%; background: var(--kd-cover); border-radius: .055em; transform: rotate(-7deg); }
  #kd-notepad-refinements .kd-page { left: 6%; right: 0; top: 0; bottom: 5%; background: var(--kd-sheet); border-radius: 0 .04em .04em 0; }
  #kd-notepad-refinements .kd-page::after { content: ''; left: 18%; top: 65%; width: 55%; height: 5%; background: var(--kd-blue-ink); border-radius: .015em; box-shadow: 0 .10em 0 var(--kd-blue-ink); }
  #kd-notepad-refinements .kd-notebook .kd-brand { inset: 11% 8% 40% 9%; color: var(--kd-blue-ink); }
  #kd-notepad-refinements .kd-pen { left: 66%; top: 37%; width: 12%; height: 46%; background: var(--kd-blue); border-radius: .025em .025em 0 0; border-left: .025em solid var(--kd-blue-edge); transform: rotate(34deg); }
  #kd-notepad-refinements .kd-pen::before { content: ''; left: 65%; top: 5%; width: .025em; height: .14em; border-radius: .02em; background: var(--kd-blue-ink); }
  #kd-notepad-refinements .kd-pen::after { content: ''; left: -.025em; top: 100%; width: .12em; height: .13em; background: var(--kd-blue-ink); clip-path: polygon(0 0,100% 0,50% 100%); }

  /* Keep blue in a few recognisable features rather than filling the page. */
  #kd-notepad-refinements .kd-notepad {
    --kd-sheet: #fafafa;
    --kd-cover: light-dark(#579bd0, #6baee0);
    --kd-paper-ink: #303944;
    --kd-paper-rule: #87919a;
    --kd-blue: light-dark(#6cb6e8, #87c7f2);
    --kd-title-blue: light-dark(#3d85bb, #539ed1);
  }
  #kd-notepad-refinements .kd-notebook .kd-brand { color: var(--kd-paper-ink); }
  #kd-notepad-refinements .kd-page::after { background: var(--kd-paper-rule); box-shadow: 0 .10em 0 var(--kd-paper-rule); }
  #kd-notepad-refinements .kd-spine .kd-page { left: 14%; }

  #kd-notepad-refinements .kd-header .kd-notebook { background: #d4d9df; }
  #kd-notepad-refinements .kd-header .kd-page { left: 5%; }
  #kd-notepad-refinements .kd-header .kd-page::before { content: ''; inset: 0 0 60%; border-radius: 0 .04em 0 0; background: var(--kd-title-blue); }
  #kd-notepad-refinements .kd-header .kd-notebook .kd-brand { inset: 0 8% 58%; color: #ffffff; }
  #kd-notepad-refinements .kd-header .kd-notebook .kd-brand span { font-size: .18em; }

  #kd-notepad-refinements .kd-binding .kd-page { top: 12%; left: 5%; }
  #kd-notepad-refinements .kd-binding .kd-notebook::before { content: ''; left: 14%; top: -4%; width: 5%; height: 15%; background: var(--kd-blue-ink); border-radius: .018em; box-shadow: .14em 0 0 var(--kd-blue-ink), .28em 0 0 var(--kd-blue-ink); z-index: 1; }
  #kd-notepad-refinements .kd-binding .kd-pen { background: linear-gradient(var(--kd-blue) 0 28%, #e1e5e9 28% 100%); border-left-color: #a2a9b0; }
  #kd-notepad-refinements .kd-binding .kd-notebook .kd-brand { color: var(--kd-blue-ink); }

  #kd-notepad-refinements .kd-ink .kd-notebook { background: #d4d9df; }
  #kd-notepad-refinements .kd-ink .kd-notebook .kd-brand { color: var(--kd-blue-ink); }
  #kd-notepad-refinements .kd-ink .kd-page::after { background: var(--kd-blue-ink); box-shadow: 0 .10em 0 var(--kd-blue-ink); opacity: .65; }
  #kd-notepad-refinements .kd-ink .kd-pen { background: light-dark(#54a6de, #7ebfed); }

  /* The open cup sits in front of three distinctly shaped drawing tools. */
  #kd-notepad-refinements .kd-paint .kd-art { transform: translateX(-2%) scale(.94); }
  #kd-notepad-refinements .kd-cup-handle { left: 69%; top: 55%; width: 16%; height: 23%; border: .045em solid var(--kd-cup-edge); border-radius: 0 .09em .09em 0; }
  #kd-notepad-refinements .kd-cup-opening { left: 26%; top: 45%; width: 48%; height: 10%; background: var(--kd-cup-inner); border-radius: 50%; box-shadow: inset 0 .015em 0 var(--kd-cup); }
  #kd-notepad-refinements .kd-pencil { left: 35%; top: 28%; width: 10%; height: 33%; background: var(--kd-yellow); border-left: .025em solid var(--kd-yellow-edge); transform: rotate(-10deg); transform-origin: center bottom; }
  #kd-notepad-refinements .kd-pencil::before { content: ''; left: -.025em; top: -.10em; width: .10em; height: .10em; background: var(--kd-wood); clip-path: polygon(50% 0,100% 100%,0 100%); }
  #kd-notepad-refinements .kd-pencil::after { content: ''; left: .01em; top: -.10em; width: .029em; height: .05em; background: var(--kd-graphite); clip-path: polygon(50% 0,100% 100%,0 100%); }
  #kd-notepad-refinements .kd-paintbrush { left: 48%; top: 27%; width: 7%; height: 34%; background: var(--kd-brush-wood); border-left: .012em solid var(--kd-brush-wood-edge); border-radius: 0 0 .03em .03em; transform: rotate(3deg); transform-origin: center bottom; }
  #kd-notepad-refinements .kd-paintbrush::before { content: ''; left: -25%; top: -.18em; width: 150%; height: .20em; background: repeating-linear-gradient(90deg, var(--kd-bristle) 0 .022em, var(--kd-bristle-edge) .022em .027em); clip-path: polygon(60% 0,82% 18%,94% 40%,100% 64%,95% 84%,84% 100%,16% 100%,5% 84%,0 64%,6% 40%,22% 16%); }
  #kd-notepad-refinements .kd-paintbrush::after { content: ''; left: -20%; top: 0; width: 140%; height: .085em; background: var(--kd-metal); border-bottom: .015em solid var(--kd-brush-wood-edge); }
  #kd-notepad-refinements .kd-marker { left: 58%; top: 28%; width: 10%; height: 33%; background: var(--kd-purple); border-radius: .025em; transform: rotate(13deg); transform-origin: center bottom; }
  #kd-notepad-refinements .kd-marker::before { content: ''; left: 0; top: 0; width: 100%; height: 31%; background: var(--kd-purple-edge); border-radius: .025em .025em 0 0; }
  #kd-notepad-refinements .kd-marker::after { content: ''; left: 65%; top: 4%; width: .018em; height: .09em; background: var(--kd-purple); border-radius: .01em; }
  #kd-notepad-refinements .kd-cup { left: 26%; top: 50%; width: 48%; height: 35%; background: var(--kd-cup); border-radius: 0 0 .075em .075em; }
  #kd-notepad-refinements .kd-cup .kd-brand { inset: 12% 9% 14%; color: var(--kd-cup-ink); }
  #kd-notepad-refinements .kd-cup .kd-brand span { font-size: .225em; }

  #kd-notepad-refinements .kd-crops { border-top: 1px solid var(--kd-rule); padding-top: 18px; display: grid; gap: 16px; }
  #kd-notepad-refinements .kd-crop-row { display: grid; grid-template-columns: minmax(80px, .9fr) repeat(2, minmax(0, 1fr)); gap: 12px; align-items: center; }
  #kd-notepad-refinements .kd-crop-row > span { font-size: 12px; color: var(--kd-muted); }
  #kd-notepad-refinements .kd-crop-head > span:not(:first-child) { text-align: center; }
  #kd-notepad-refinements .kd-crop-slot { display: flex; justify-content: center; }
  #kd-notepad-refinements .kd-crop-slot .kd-logo { font-size: 64px; }
  #kd-notepad-refinements .kd-footer { margin-top: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; color: var(--kd-muted); font-size: 11px; }
  @media (max-width: 480px) {
    #kd-notepad-refinements .kd-board { padding: 22px 16px; }
    #kd-notepad-refinements .kd-heading { padding-right: 65px; }
    #kd-notepad-refinements .kd-heading p { min-height: 36px; }
    #kd-notepad-refinements .kd-pair { gap: 12px; }
    #kd-notepad-refinements .kd-app > .kd-logo { font-size: min(var(--kd-size), 29vw); }
    #kd-notepad-refinements .kd-app h3 { font-size: 16px; }
    #kd-notepad-refinements .kd-appearance select { font-size: 16px; }
    #kd-notepad-refinements .kd-footer span:first-child { display: none; }
  }
</style>
<div id="kd-notepad-refinements" aria-label="Notepad logo refinement settings">
  <div class="viz-carousel viz-dotted-background" aria-label="KD Notepad blue accent variants">
  <section data-variant="Blue spine" aria-label="Blue spine design">
  <div class="kd-board kd-spine" aria-label="Blue spine logo variant">
    <header class="kd-heading"><h2>Blue spine</h2><p>Neutral paper · blue cover edge + pen</p></header>
    <div class="kd-appearance">
      <label for="kd-notepad-appearance">Icon appearance</label>
      <select id="kd-notepad-appearance" class="cursor-interaction"><option value="system">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </div>
    <div class="kd-pair">
      <article class="kd-app">
        <div class="kd-logo kd-notepad" role="img" aria-label="Square KD Notepad logo with neutral paper, a blue spine and a blue pen">
          <div class="kd-tile"></div>
          <div class="kd-art">
            <div class="kd-notebook"><div class="kd-page"><div class="kd-brand"><span>KD</span></div></div></div>
            <div class="kd-pen"></div>
          </div>
        </div>
        <h3>KD Notepad</h3>
      </article>
      <article class="kd-app">
        <div class="kd-logo kd-paint" role="img" aria-label="Square KD Paint logo with a white KD cup holding, from left to right, a golden pencil, a brown wooden paintbrush with pointed bristles and a silver ferrule, and a purple capped marker">
          <div class="kd-tile"></div>
          <div class="kd-art">
            <div class="kd-cup-handle"></div><div class="kd-cup-opening"></div>
            <div class="kd-pencil"></div><div class="kd-paintbrush"></div><div class="kd-marker"></div>
            <div class="kd-cup"><div class="kd-brand"><span>KD</span></div></div>
          </div>
        </div>
        <h3>KD Paint</h3>
      </article>
    </div>
    <div class="kd-crops" role="group" aria-label="Launcher crop previews">
      <div class="kd-crop-row kd-crop-head"><span>Crop</span><span>KD Notepad</span><span>KD Paint</span></div>
      <div class="kd-crop-row"><span>Squircle</span><div class="kd-crop-slot" data-app="kd-notepad" data-mask="squircle"></div><div class="kd-crop-slot" data-app="kd-paint" data-mask="squircle"></div></div>
      <div class="kd-crop-row"><span>Rounded square</span><div class="kd-crop-slot" data-app="kd-notepad" data-mask="rounded"></div><div class="kd-crop-slot" data-app="kd-paint" data-mask="rounded"></div></div>
      <div class="kd-crop-row"><span>Circle</span><div class="kd-crop-slot" data-app="kd-notepad" data-mask="circle"></div><div class="kd-crop-slot" data-app="kd-paint" data-mask="circle"></div></div>
    </div>
    <footer class="kd-footer"><span>KD NOTEPAD / BLUE ACCENTS</span><span>Square originals · 64px crops</span></footer>
    <span id="kd-notepad-mode-status" class="sr-only" aria-live="polite"></span>
  </div>
  </section>
  <section data-variant="Blue header" aria-label="Blue header design" hidden></section>
  <section data-variant="Blue binding" aria-label="Blue binding design" hidden></section>
  <section data-variant="Blue ink" aria-label="Blue ink design" hidden></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('kd-notepad-refinements');
  const board = root.querySelector('.kd-board');
  const alternatives = [
    { name: 'Blue header', style: 'header', caption: 'Neutral paper · blue title band', description: 'Neutral paper, a blue KD header band and a blue pen' },
    { name: 'Blue binding', style: 'binding', caption: 'Neutral paper · blue binding + pen cap', description: 'Neutral paper, blue notebook binding, blue KD print and a silver pen with a blue cap' },
    { name: 'Blue ink', style: 'ink', caption: 'Neutral paper · blue lettering + pen', description: 'Neutral paper with blue KD print, blue text lines and a blue pen' }
  ];
  for (const alternative of alternatives) {
    const copy = board.cloneNode(true);
    copy.classList.replace('kd-spine', 'kd-' + alternative.style);
    copy.setAttribute('aria-label', alternative.name + ' logo variant');
    copy.querySelector('h2').textContent = alternative.name;
    copy.querySelector('.kd-heading p').textContent = alternative.caption;
    copy.querySelector('.kd-app > .kd-notepad').setAttribute('aria-label', alternative.description);
    const picker = copy.querySelector('select');
    picker.id += '-' + alternative.style;
    copy.querySelector('label').htmlFor = picker.id;
    copy.querySelector('[aria-live]').removeAttribute('id');
    root.querySelector('[data-variant="' + alternative.name + '"]').appendChild(copy);
  }
  const pickers = root.querySelectorAll('select');
  // A fourth-order superellipse gives a continuous squircle rather than circular corners.
  const squircle = Array.from({ length: 128 }, (_, i) => {
    const angle = i * 2 * Math.PI / 128;
    const x = Math.cos(angle), y = Math.sin(angle);
    return `${(50 + 50 * Math.sign(x) * Math.sqrt(Math.abs(x))).toFixed(3)}% ${(50 + 50 * Math.sign(y) * Math.sqrt(Math.abs(y))).toFixed(3)}%`;
  });
  root.style.setProperty('--kd-squircle-mask', 'polygon(' + squircle.join(',') + ')');
  const maskLabels = { squircle: 'squircle', rounded: 'rounded square', circle: 'circle' };
  for (const slot of root.querySelectorAll('.kd-crop-slot')) {
    const original = slot.closest('.kd-board').querySelector('.kd-app > .' + slot.dataset.app);
    const copy = original.cloneNode(true);
    copy.classList.add('kd-mask-' + slot.dataset.mask);
    copy.setAttribute('aria-label', (slot.dataset.app === 'kd-notepad' ? 'KD Notepad' : 'KD Paint') + ', ' + maskLabels[slot.dataset.mask] + ' crop');
    slot.appendChild(copy);
  }
  const state = { size: 120, appearance: 'system' };
  const applyAppearance = () => {
    for (const logo of root.querySelectorAll('.kd-logo')) {
      logo.style.colorScheme = state.appearance === 'system' ? 'light dark' : state.appearance;
    }
    for (const picker of pickers) picker.value = state.appearance;
  };
  const restore = saved => {
    const appearance = saved?.privateContent?.appearance;
    if (['light', 'dark', 'system'].includes(appearance)) state.appearance = appearance;
    applyAppearance();
  };
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
  for (const picker of pickers) picker.addEventListener('change', () => {
    state.appearance = picker.value;
    applyAppearance();
    picker.closest('.kd-board').querySelector('[aria-live]').textContent = 'Appearance: ' + picker.selectedOptions[0].textContent;
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({ privateContent: { appearance: state.appearance } }).catch(() => {});
    }
  });
  const render = () => {
    for (const item of root.querySelectorAll('.kd-board')) item.style.setProperty('--kd-size', state.size + 'px');
  };
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addSlider(state, 'size', { label: 'Hero logo size', min: 96, max: 152, unit: 'px' });
  }
})();
</script>
