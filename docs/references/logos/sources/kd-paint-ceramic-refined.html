<style>
  #kd-paint-ceramic-refined { color-scheme: light dark; }
  #kd-paint-ceramic-refined .paint-board {
    --study-bg: light-dark(#edf1f3,#23292c); --study-text: light-dark(#203c40,#e5efed);
    --study-muted: light-dark(#52676a,#b6c8c6); --study-rule: light-dark(#ced9da,#405352);
    color: var(--study-text); background: var(--study-bg); border-radius: 22px;
    padding: 24px 28px; box-sizing: border-box; font: 14px/1.5 ui-sans-serif,system-ui,sans-serif;
  }
  #kd-paint-ceramic-refined .paint-heading { min-height: 58px; padding-right: 90px; }
  #kd-paint-ceramic-refined h2 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.025em; }
  #kd-paint-ceramic-refined .paint-subtitle { margin-top: 3px; color: var(--study-muted); font-size: 12px; }
  #kd-paint-ceramic-refined .paint-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 20px 0 24px; }
  #kd-paint-ceramic-refined figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  #kd-paint-ceramic-refined figcaption, #kd-paint-ceramic-refined .paint-crops > span { font-size: 12px; color: var(--study-muted); }
  #kd-paint-ceramic-refined .paint-icon { display: block; width: min(100%,240px); height: auto; aspect-ratio: 1; background: #fff; }
  #kd-paint-ceramic-refined .paint-icon[data-mode="dark"] { background: #1a1a1a; }
  #kd-paint-ceramic-refined .paint-crops { display: grid; grid-template-columns: 108px 1fr 1fr; align-items: center; gap: 14px 12px; padding-top: 20px; border-top: 1px solid var(--study-rule); }
  #kd-paint-ceramic-refined .paint-slot { display: flex; justify-content: center; }
  #kd-paint-ceramic-refined .paint-slot .paint-icon { width: 72px; }
  #kd-paint-ceramic-refined .paint-squircle { clip-path: polygon(0% 30%,.4% 20%,1.5% 12%,4% 6%,8% 2.5%,15% .5%,30% 0%,70% 0%,85% .5%,92% 2.5%,96% 6%,98.5% 12%,99.6% 20%,100% 30%,100% 70%,99.6% 80%,98.5% 88%,96% 94%,92% 97.5%,85% 99.5%,70% 100%,30% 100%,15% 99.5%,8% 97.5%,4% 94%,1.5% 88%,.4% 80%,0% 70%); }
  #kd-paint-ceramic-refined .paint-rounded { clip-path: inset(0 round 22%); }
  #kd-paint-ceramic-refined .paint-circle { clip-path: circle(50%); }
  @media (max-width:480px) {
    #kd-paint-ceramic-refined .paint-board { padding: 22px 16px; }
    #kd-paint-ceramic-refined .paint-heading { min-height: 88px; }
    #kd-paint-ceramic-refined .paint-pair { gap: 14px; }
    #kd-paint-ceramic-refined .paint-crops { grid-template-columns: 100px 1fr 1fr; gap: 12px 6px; }
    #kd-paint-ceramic-refined .paint-slot .paint-icon { width: 48px; }
  }
</style>
<div id="kd-paint-ceramic-refined" aria-label="KD Paint refined original ceramic logo">
  <div class="viz-dotted-background">
    <section aria-label="Refined white ceramic cup">
      <div class="paint-board" aria-label="Refined ceramic">
        <header class="paint-heading"><h2>Refined ceramic</h2><div class="paint-subtitle">Rolled rim · softened handle joins</div></header>
        <div class="paint-pair">
          <figure><canvas class="paint-icon" width="1024" height="1024" data-mode="light" role="img" aria-label="Light KD Paint: original white ceramic cup with shallow rolled rim, softly flared handle joins, solid dark KD and corrected pencil graphite">Refined ceramic Paint logo, light.</canvas><figcaption>Light · white</figcaption></figure>
          <figure><canvas class="paint-icon" width="1024" height="1024" data-mode="dark" role="img" aria-label="Dark KD Paint: opaque white ceramic cup with refined rim and handle, original colored tools and solid dark KD on a flat dark background">Refined ceramic Paint logo, dark.</canvas><figcaption>Dark · #1a1a1a</figcaption></figure>
        </div>
        <div class="paint-crops" aria-label="Refined ceramic light and dark crop previews"></div>
      </div>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('kd-paint-ceramic-refined');
  const state = { rimDepth: 1.7, bevel: 100 };
  const board = root.querySelector('.paint-board');
  function restore(saved) {
    for (const [name,min,max] of [['rimDepth',.7,3],['bevel',50,140]]) {
      if (Number.isFinite(saved?.[name])) state[name] = Math.max(min,Math.min(max,saved[name]));
    }
  }
  restore(window.openai?.widgetState?.privateContent);
  {
    const crops = board.querySelector('.paint-crops');
    for (const [name,mask] of [['Squircle','squircle'],['Rounded square','rounded'],['Circle','circle']]) {
      const label = document.createElement('span'); label.textContent = name; crops.appendChild(label);
      for (const mode of ['light','dark']) {
        const slot = document.createElement('div'); slot.className = 'paint-slot';
        const icon = document.createElement('canvas'); icon.width = 600; icon.height = 600;
        icon.className = 'paint-icon paint-' + mask; icon.dataset.mode = mode;
        icon.setAttribute('role','img'); icon.setAttribute('aria-label',`Refined ceramic KD Paint, ${mode}, ${name} crop`);
        slot.appendChild(icon); crops.appendChild(slot);
      }
    }
  }
  const wordmark = new Path2D('M0,0H3.6V6.2L8.8,0H13.3L6.9,7.4L13.8,16H9.2L3.6,9V16H0ZM14.5,0H20.6C26.1,0 29.6,3 29.6,8C29.6,13 26.1,16 20.6,16H14.5ZM18.1,3.3V12.7H20.4C23.9,12.7 25.8,11.1 25.8,8C25.8,4.9 23.9,3.3 20.4,3.3Z');
  function paint(canvas) {
    const ctx = canvas.getContext('2d');
    const dark = canvas.dataset.mode === 'dark';
    const depth = state.rimDepth, shoulder = depth * 10 / 17;
    const bevel = state.bevel / 100;
    const outline = dark ? '#ffffff70' : '#1a1a1a66';
    const p = dark ? {
      gold:'#f9c14e', goldLight:'#ffe293', goldDark:'#dda739', goldEdge:'#d49b2e', woodTip:'#f0d2a6',
      wood:'#c88b52', woodLight:'#e0ad79', woodDark:'#a36b3f', woodEdge:'#945b31', bristle:'#9b7656', bristleEdge:'#79583d',
      purple:'#b896e8', purpleLight:'#d4bcf2', purpleDark:'#9670cb', purpleEdge:'#8d62c4', metal:'#dbe4ed', metalLight:'#ffffff', metalDark:'#acbac5'
    } : {
      gold:'#f2b12f', goldLight:'#ffdc7d', goldDark:'#ce901f', goldEdge:'#c7891f', woodTip:'#efd5ac',
      wood:'#a2673b', woodLight:'#c78f5b', woodDark:'#7a4b2d', woodEdge:'#704226', bristle:'#70513b', bristleEdge:'#513927',
      purple:'#9870ce', purpleLight:'#b899e5', purpleDark:'#7852ad', purpleEdge:'#6c479f', metal:'#c4d5e2', metalLight:'#f8fbfd', metalDark:'#94a3af'
    };
    const gradient = (x1,y1,x2,y2,stops) => {
      const g = ctx.createLinearGradient(x1,y1,x2,y2);
      for (const [at,color] of stops) g.addColorStop(at,color);
      return g;
    };
    const rectangle = (x,y,w,h,r=0) => { const path = new Path2D(); path.roundRect(x,y,w,h,r); return path; };
    const rotate = (angle,x,y) => { ctx.translate(x,y); ctx.rotate(angle*Math.PI/180); ctx.translate(-x,-y); };
    function solid(path,fill,stroke=outline,width=.3) {
      ctx.fillStyle = fill; ctx.fill(path); ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(path);
    }
    const ceramicShade = dark ? '#e3e9ed' : '#e0e5e9';
    ctx.setTransform(canvas.width/100,0,0,canvas.height/100,0,0);
    ctx.fillStyle = dark ? '#1a1a1a' : '#ffffff'; ctx.fillRect(0,0,100,100);
    ctx.save(); ctx.translate(48,50); ctx.scale(.94,.94); ctx.translate(-50,-50);
    // Carry over Rolled rim geometry, retaining the original opaque ceramic finish.
    const profile = {
      front: `M26 50C26 ${50+shoulder} 36.75 ${50+depth} 50 ${50+depth}S74 ${50+shoulder} 74 50V77.5Q74 85 66.5 85H33.5Q26 85 26 77.5Z`,
      lip: `M26 50C26 ${50+shoulder} 36.75 ${50+depth} 50 ${50+depth}S74 ${50+shoulder} 74 50`,
      handle: 'M72.8 54.5Q74 55 76.5 55Q85 55 85 63.5V69Q85 78 76.5 78Q74 78 72.8 78.5V73Q74.4 73.9 76.5 73.9Q81 73.9 81 69V63.5Q81 59.1 76.5 59.1Q74.4 59.1 72.8 60Z',
      rear: `M26 50C26 ${50-shoulder} 36.75 ${50-depth} 50 ${50-depth}S74 ${50-shoulder} 74 50`
    };
    const body = new Path2D('M26 50H74V77.5Q74 85 66.5 85H33.5Q26 85 26 77.5Z');
    const front = new Path2D(profile.front);
    const handle = new Path2D(profile.handle);
    const handleShade = dark ? ceramicShade : '#bdc8d1';
    solid(handle,gradient(72.8,54.5,85,54.5,[[0,ceramicShade],[.32,'#ffffff'],[.72,'#ffffff'],[1,handleShade]]));
    ctx.save(); ctx.clip(handle); ctx.translate(.35,.25);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = .5; ctx.stroke(handle); ctx.restore();
    // Keep both edges of the white handle readable against the white light tile.
    if (!dark) {
      ctx.strokeStyle = '#8e9da8'; ctx.lineWidth = .5; ctx.stroke(handle);
    }
    ctx.fillStyle = '#ffffff'; ctx.fill(body);
    const mouth = new Path2D(profile.rear + `C74 ${50+shoulder} 63.25 ${50+depth} 50 ${50+depth}S26 ${50+shoulder} 26 50Z`);
    solid(mouth,gradient(26,50-depth,26,50+depth,[[0,'#c5cdd3'],[1,dark ? '#dedede' : '#d4d4d4']]));
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = .7; ctx.stroke(new Path2D(profile.rear));

    // The original colored tools sit behind the opaque cup face.
    ctx.save(); rotate(-10,40,61);
    const pencil = rectangle(35,28,10,52);
    solid(pencil,gradient(35,28,45,28,[[0,p.goldLight],[.24,p.goldLight],[.24,p.gold],[.75,p.gold],[1,p.goldDark]]));
    ctx.fillStyle = p.goldEdge; ctx.fillRect(35,28,2.5,52);
    solid(new Path2D('M40 18L45 28H35Z'),p.woodTip);
    // The graphite occupies the upper half of the wooden tip, sharing its sides.
    solid(new Path2D('M40 18L42.5 23H37.5Z'),'#3a4652'); ctx.restore();

    ctx.save(); rotate(3,51.5,61);
    const brush = rectangle(48,27,7,53,[0,0,2,2]);
    solid(brush,gradient(48,27,55,27,[[0,p.woodLight],[.25,p.woodLight],[.25,p.wood],[.75,p.wood],[1,p.woodDark]]));
    ctx.strokeStyle = p.woodEdge; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(48.6,28); ctx.lineTo(48.6,79); ctx.stroke();
    const bristles = new Path2D('M52.97 9L54.884 12.6L55.928 17L56.45 21.8L56.015 25.8L55.058 29H49.142L48.185 25.8L47.75 21.8L48.272 17L49.664 12.2Z');
    solid(bristles,p.bristle); ctx.save(); ctx.clip(bristles);
    ctx.strokeStyle = p.bristleEdge; ctx.lineWidth = .5;
    for (const x of [49.2,51.9,54.6]) { ctx.beginPath(); ctx.moveTo(x,11); ctx.lineTo(x,29); ctx.stroke(); } ctx.restore();
    solid(rectangle(48.04,27,8.12,8.5),gradient(48.04,27,56.16,27,[[0,p.metalLight],[.24,p.metal],[.75,p.metal],[1,p.metalDark]]));
    ctx.restore();

    ctx.save(); rotate(13,63,61);
    const marker = rectangle(58,28,10,52,2.5);
    solid(marker,gradient(58,28,68,28,[[0,p.purpleLight],[.24,p.purple],[.75,p.purple],[1,p.purpleDark]]));
    solid(rectangle(58,28,10,10.23,[2.5,2.5,0,0]),gradient(58,28,68,28,[[0,p.purple],[.24,p.purpleEdge],[.75,p.purpleEdge],[1,p.purpleDark]]));
    ctx.fillStyle = p.purple; ctx.fill(rectangle(64.5,29.32,1.8,9,1)); ctx.restore();

    solid(front,gradient(26,50,74,50,[[0,ceramicShade],[.14,'#ffffff'],[.84,'#ffffff'],[1,ceramicShade]]));
    ctx.save(); ctx.clip(front);
    ctx.fillStyle = gradient(26,77,26,85,[[0,'#1a1a1a00'],[1,`rgba(26,26,26,${.09*bevel})`]]); ctx.fillRect(26,77,48,8);
    ctx.strokeStyle = `rgba(116,129,140,${.20*bevel})`; ctx.lineWidth = .35;
    ctx.save(); ctx.translate(0,.7); ctx.stroke(new Path2D(profile.lip)); ctx.restore();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = .65; ctx.stroke(new Path2D(profile.lip));
    ctx.strokeStyle = '#ffffffa6'; ctx.lineWidth = .45;
    ctx.beginPath(); ctx.moveTo(27,77.5); ctx.quadraticCurveTo(27,84,33.5,84); ctx.lineTo(66.5,84); ctx.quadraticCurveTo(73,84,73,77.5); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(35.2,59.15);
    ctx.fillStyle = '#252525'; ctx.fill(wordmark,'evenodd'); ctx.restore(); ctx.restore();
  }
  function render() {
    board.querySelectorAll('canvas').forEach(paint);
  }
  function changed() {
    render();
    window.openai?.setWidgetState?.({
      privateContent: { ...state },
      modelContent: { study: 'Original ceramic KD Paint with rolled rim, softened handle joins and corrected graphite', ...state }
    }).catch(() => {});
  }
  render();
  window.addEventListener('openai:set_globals',event => {
    const saved = event.detail?.globals?.widgetState?.privateContent;
    if (saved) { restore(saved); render(); }
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: board, onChange: changed });
    tweak.addSlider(state,'rimDepth',{ label: 'Rim depth', min: .7, max: 3, step: .1, reference: 'ceramic.rimDepth' });
    tweak.addSlider(state,'bevel',{ label: 'Bevel strength', min: 50, max: 140, unit: '%', reference: 'ceramic.bevel' });
  }
})();
</script>
