<style>
  #kd-explorer-directions { color-scheme: light dark; }
  #kd-explorer-directions .ex-board {
    --ex-stage: light-dark(#edf2f6,#1e2630); --ex-text: light-dark(#24394b,#e9f0f7);
    --ex-muted: light-dark(#53687b,#b1c2d2); --ex-rule: light-dark(#cfdbe5,#3d4d5d);
    background: var(--ex-stage); color: var(--ex-text); border-radius: 22px; padding: 24px 28px;
    font: 14px/1.5 ui-sans-serif,system-ui,sans-serif; box-sizing: border-box;
  }
  #kd-explorer-directions .ex-heading { min-height: 60px; padding-right: 90px; }
  #kd-explorer-directions h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.025em; }
  #kd-explorer-directions .ex-subtitle { margin-top: 4px; color: var(--ex-muted); font-size: 12px; }
  #kd-explorer-directions .ex-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 22px 0 24px; }
  #kd-explorer-directions figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  #kd-explorer-directions figcaption { color: var(--ex-muted); font-size: 12px; }
  #kd-explorer-directions .ex-icon {
    --ex-base: #fff; --ex-amber: #e5af4b; --ex-bright: #f9d68f; --ex-deep: #bb822a;
    --ex-ink: #604718; --ex-paper: #fff; --ex-paper-edge: #dfe6eb;
    --ex-metal: #b6c5cf; --ex-metal-light: #f9fcfd; --ex-metal-dark: #7f929f;
    --ex-outline: #1a1a1a61; --ex-line: #9caab3;
    --ex-ramp: linear-gradient(135deg,var(--ex-bright),var(--ex-amber) 30% 76%,var(--ex-deep));
    --ex-metal-ramp: linear-gradient(135deg,var(--ex-metal-light),var(--ex-metal) 34% 76%,var(--ex-metal-dark));
    width: 1em; height: 1em; font-size: 180px; position: relative; overflow: hidden;
    background: var(--ex-base); isolation: isolate; flex: 0 0 auto;
  }
  #kd-explorer-directions .ex-icon[data-mode="dark"] {
    --ex-base: #1a1a1a; --ex-amber: #efc26b; --ex-bright: #ffe3ab; --ex-deep: #c49342;
    --ex-ink: #62491e; --ex-paper-edge: #cbd5de;
    --ex-metal: #d1dde6; --ex-metal-light: #fff; --ex-metal-dark: #a2b2be;
    --ex-outline: #ffffff75;
  }
  #kd-explorer-directions .ex-art { position: absolute; inset: 0; transform: rotate(-5deg); filter: drop-shadow(.004em 0 0 var(--ex-outline)) drop-shadow(-.004em 0 0 var(--ex-outline)) drop-shadow(0 .004em 0 var(--ex-outline)) drop-shadow(0 -.004em 0 var(--ex-outline)); }
  #kd-explorer-directions .ex-art * { position: absolute; box-sizing: border-box; }
  #kd-explorer-directions .ex-tab { left: 17%; top: 23%; width: 29%; height: 17%; border-radius: .035em .035em 0 0; background: linear-gradient(135deg,var(--ex-bright),var(--ex-amber)); }
  #kd-explorer-directions .ex-back { left: 17%; top: 31%; width: 66%; height: 47%; border-radius: .035em; background: linear-gradient(135deg,var(--ex-amber),var(--ex-deep)); box-shadow: inset .008em .008em 0 #fff8; }
  #kd-explorer-directions .ex-front { left: 17%; top: 38%; width: 66%; height: 40%; border-radius: .035em; background: var(--ex-ramp); box-shadow: inset .008em .012em 0 #fff8,inset -.008em -.012em 0 #79541726; }
  #kd-explorer-directions .ex-lip { left: 22%; top: 38%; width: 56%; height: 1.1%; border-radius: .01em; background: #fff8; }
  #kd-explorer-directions .ex-brand { inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #kd-explorer-directions .ex-paper { left: 28%; top: 27%; width: 45%; height: 42%; background: linear-gradient(135deg,var(--ex-paper) 70%,var(--ex-paper-edge)); border-radius: .025em; transform: rotate(7deg); box-shadow: -.012em .012em .012em #27343c26; }
  #kd-explorer-directions .ex-paper.back { left: 24%; top: 23%; transform: rotate(-5deg); }
  #kd-explorer-directions .ex-paper::before { content: ''; position: absolute; left: 16%; top: 18%; width: 55%; height: 4%; border-radius: .01em; background: var(--ex-line); box-shadow: 0 .05em 0 var(--ex-line),0 .1em 0 var(--ex-line); opacity: .6; }
  #kd-explorer-directions .ex-open .ex-back { top: 29%; height: 50%; }
  #kd-explorer-directions .ex-open .ex-tab { top: 21%; }
  #kd-explorer-directions .ex-open .ex-front { left: 12%; top: 42%; width: 76%; height: 38%; clip-path: polygon(9% 0,100% 0,91% 100%,0 100%); border-radius: .03em; }
  #kd-explorer-directions .ex-open .ex-lip { left: 23%; top: 42%; width: 58%; }
  #kd-explorer-directions .ex-compass { left: 65%; top: 62%; width: 25%; height: 25%; border-radius: 50%; background: var(--ex-metal-ramp); box-shadow: .005em .008em .012em #1a1a1a26; }
  #kd-explorer-directions .ex-compass-face { inset: 10%; border-radius: 50%; background: linear-gradient(145deg,#fff,#eaf0f2); box-shadow: inset .004em .004em .008em #73858f66; }
  #kd-explorer-directions .ex-compass-face::before { content: ''; position: absolute; left: 41%; top: 11%; width: 23%; height: 78%; background: linear-gradient(to bottom,var(--ex-deep) 50%,var(--ex-metal-dark) 50%); clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); transform: rotate(26deg); }
  #kd-explorer-directions .ex-compass-face::after { content: ''; position: absolute; left: 46%; top: 45%; width: 12%; height: 12%; border-radius: 50%; background: var(--ex-metal-light); }
  #kd-explorer-directions .ex-drawer .ex-art { transform: rotate(-3deg); }
  #kd-explorer-directions .ex-drawer-back { left: 20%; top: 24%; width: 60%; height: 55%; border-radius: .04em; background: var(--ex-metal-ramp); box-shadow: inset .008em .008em 0 #fff9,inset -.008em -.008em 0 #4d637333; }
  #kd-explorer-directions .ex-divider { left: 27%; top: 20%; width: 21%; height: 16%; border-radius: .018em .018em 0 0; background: linear-gradient(135deg,#fff,var(--ex-paper-edge)); }
  #kd-explorer-directions .ex-divider.middle { left: 43%; top: 23%; background: var(--ex-ramp); }
  #kd-explorer-directions .ex-divider.right { left: 59%; top: 26%; background: var(--ex-metal-ramp); }
  #kd-explorer-directions .ex-drawer-front { left: 21%; top: 36%; width: 58%; height: 44%; border-radius: .025em .025em .04em .04em; background: var(--ex-ramp); box-shadow: inset .008em .01em 0 #fff8,inset -.008em -.012em 0 #79541733; }
  #kd-explorer-directions .ex-label { left: 30%; top: 43%; width: 40%; height: 26%; border-radius: .025em; background: var(--ex-metal-ramp); padding: 1.4%; }
  #kd-explorer-directions .ex-label::before { content: ''; position: absolute; inset: 8% 4%; border-radius: .012em; background: linear-gradient(135deg,#fff,#eaf0f2); }
  #kd-explorer-directions .ex-pull { left: 40%; top: 72%; width: 20%; height: 3.2%; border-radius: .015em; background: linear-gradient(#fff,var(--ex-metal) 50%,var(--ex-metal-dark)); box-shadow: 0 .008em 0 #66441633; }
  #kd-explorer-directions .ex-crops { display: grid; grid-template-columns: 88px 1fr 1fr; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--ex-rule); }
  #kd-explorer-directions .ex-crops > span { color: var(--ex-muted); font-size: 12px; }
  #kd-explorer-directions .ex-slot { display: flex; justify-content: center; }
  #kd-explorer-directions .ex-slot .ex-icon { font-size: 56px; }
  #kd-explorer-directions .ex-squircle { clip-path: polygon(0% 30%,.4% 20%,1.5% 12%,4% 6%,8% 2.5%,15% .5%,30% 0%,70% 0%,85% .5%,92% 2.5%,96% 6%,98.5% 12%,99.6% 20%,100% 30%,100% 70%,99.6% 80%,98.5% 88%,96% 94%,92% 97.5%,85% 99.5%,70% 100%,30% 100%,15% 99.5%,8% 97.5%,4% 94%,1.5% 88%,.4% 80%,0% 70%); }
  #kd-explorer-directions .ex-rounded { clip-path: inset(0 round 22%); }
  #kd-explorer-directions .ex-circle { clip-path: circle(50%); }
  @media(max-width:480px) {
    #kd-explorer-directions .ex-board { padding: 22px 16px; }
    #kd-explorer-directions .ex-heading { min-height: 110px; }
    #kd-explorer-directions .ex-pair { gap: 16px; }
    #kd-explorer-directions .ex-pair .ex-icon { font-size: min(160px,33vw); }
    #kd-explorer-directions .ex-crops { grid-template-columns: 76px 1fr 1fr; gap: 12px 6px; }
    #kd-explorer-directions .ex-slot .ex-icon { font-size: 48px; }
  }
</style>
<div id="kd-explorer-directions" aria-label="KD Explorer logo directions">
  <div class="viz-carousel viz-dotted-background" aria-label="KD Explorer logo directions">
    <section data-variant="Classic folder" aria-label="Classic folder KD Explorer logo">
      <div class="ex-board">
        <header class="ex-heading"><h2>Classic folder</h2><div class="ex-subtitle">Amber folder · printed KD</div></header>
        <div class="ex-pair">
          <figure><div class="ex-icon" data-mode="light" data-brand-y="51" role="img" aria-label="Light KD Explorer logo: a warm amber beveled folder with dark KD print"><div class="ex-art"><div class="ex-tab"></div><div class="ex-back"></div><div class="ex-front"></div><div class="ex-lip"></div><canvas class="ex-brand" width="600" height="600" aria-hidden="true"></canvas></div></div><figcaption>Light</figcaption></figure>
          <figure><div class="ex-icon" data-mode="dark" data-brand-y="51" role="img" aria-label="Dark classic-folder KD Explorer logo"></div><figcaption>Dark</figcaption></figure>
        </div>
        <div class="ex-crops" aria-label="Classic folder crop previews"></div>
      </div>
    </section>
    <section data-variant="Open folder" aria-label="Open folder KD Explorer logo" hidden>
      <div class="ex-board">
        <header class="ex-heading"><h2>Open folder</h2><div class="ex-subtitle">Paper peeking out · a slanted front flap</div></header>
        <div class="ex-pair">
          <figure><div class="ex-icon ex-open" data-mode="light" data-brand-y="53" role="img" aria-label="Light KD Explorer logo: an open amber folder holding two white sheets with KD on its slanted front"><div class="ex-art"><div class="ex-tab"></div><div class="ex-back"></div><div class="ex-paper back"></div><div class="ex-paper"></div><div class="ex-front"></div><div class="ex-lip"></div><canvas class="ex-brand" width="600" height="600" aria-hidden="true"></canvas></div></div><figcaption>Light</figcaption></figure>
          <figure><div class="ex-icon ex-open" data-mode="dark" data-brand-y="53" role="img" aria-label="Dark open-folder KD Explorer logo"></div><figcaption>Dark</figcaption></figure>
        </div>
        <div class="ex-crops" aria-label="Open folder crop previews"></div>
      </div>
    </section>
    <section data-variant="Folder compass" aria-label="Folder compass KD Explorer logo" hidden>
      <div class="ex-board">
        <header class="ex-heading"><h2>Folder compass</h2><div class="ex-subtitle">Familiar folder · silver navigation badge</div></header>
        <div class="ex-pair">
          <figure><div class="ex-icon" data-mode="light" data-brand-y="49" role="img" aria-label="Light KD Explorer logo: an amber KD folder with a small silver compass on its lower-right corner"><div class="ex-art"><div class="ex-tab"></div><div class="ex-back"></div><div class="ex-front"></div><div class="ex-lip"></div><canvas class="ex-brand" width="600" height="600" aria-hidden="true"></canvas><div class="ex-compass"><div class="ex-compass-face"></div></div></div></div><figcaption>Light</figcaption></figure>
          <figure><div class="ex-icon" data-mode="dark" data-brand-y="49" role="img" aria-label="Dark folder-compass KD Explorer logo"></div><figcaption>Dark</figcaption></figure>
        </div>
        <div class="ex-crops" aria-label="Folder compass crop previews"></div>
      </div>
    </section>
    <section data-variant="File drawer" aria-label="File drawer KD Explorer logo" hidden>
      <div class="ex-board">
        <header class="ex-heading"><h2>File drawer</h2><div class="ex-subtitle">Tabbed files · a silver KD label holder</div></header>
        <div class="ex-pair">
          <figure><div class="ex-icon ex-drawer" data-mode="light" data-brand-y="48" role="img" aria-label="Light KD Explorer logo: a compact amber file drawer with silver edges, file tabs and a white KD label"><div class="ex-art"><div class="ex-drawer-back"></div><div class="ex-divider"></div><div class="ex-divider middle"></div><div class="ex-divider right"></div><div class="ex-drawer-front"></div><div class="ex-label"></div><canvas class="ex-brand" width="600" height="600" aria-hidden="true"></canvas><div class="ex-pull"></div></div></div><figcaption>Light</figcaption></figure>
          <figure><div class="ex-icon ex-drawer" data-mode="dark" data-brand-y="48" role="img" aria-label="Dark file-drawer KD Explorer logo"></div><figcaption>Dark</figcaption></figure>
        </div>
        <div class="ex-crops" aria-label="File drawer crop previews"></div>
      </div>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('kd-explorer-directions');
  const state = { accent: '#e5af4b' };
  function restore(saved) {
    if (/^#[0-9a-f]{6}$/i.test(saved?.accent || '')) state.accent = saved.accent;
  }
  restore(window.openai?.widgetState?.privateContent);
  root.querySelectorAll('.ex-board').forEach(board => {
    const original = board.querySelector('.ex-pair [data-mode="light"]');
    board.querySelector('.ex-pair [data-mode="dark"]').innerHTML = original.innerHTML;
    const crops = board.querySelector('.ex-crops');
    [['Squircle','squircle'],['Rounded','rounded'],['Circle','circle']].forEach(([label,mask]) => {
      const name = document.createElement('span'); name.textContent = label; crops.appendChild(name);
      ['light','dark'].forEach(mode => {
        const slot = document.createElement('div'); slot.className = 'ex-slot';
        const icon = original.cloneNode(true); icon.dataset.mode = mode; icon.classList.add('ex-' + mask);
        icon.setAttribute('aria-label',board.querySelector('h2').textContent + ', ' + mode + ', ' + label + ' crop');
        slot.appendChild(icon); crops.appendChild(slot);
      });
    });
  });
  const wordmark = new Path2D('M0,0H3.6V6.2L8.8,0H13.3L6.9,7.4L13.8,16H9.2L3.6,9V16H0ZM14.5,0H20.6C26.1,0 29.6,3 29.6,8C29.6,13 26.1,16 20.6,16H14.5ZM18.1,3.3V12.7H20.4C23.9,12.7 25.8,11.1 25.8,8C25.8,4.9 23.9,3.3 20.4,3.3Z');
  function render() {
    root.querySelectorAll('.ex-icon').forEach(icon => {
      const dark = icon.dataset.mode === 'dark';
      const mix = (color,ratio) => `color-mix(in srgb, ${state.accent} ${ratio}%, ${color})`;
      icon.style.setProperty('--ex-amber',dark ? mix('white',78) : state.accent);
      icon.style.setProperty('--ex-bright',mix('white',dark ? 42 : 58));
      icon.style.setProperty('--ex-deep',mix(dark ? 'white' : 'black',dark ? 95 : 78));
      const canvas = icon.querySelector('.ex-brand'); const ctx = canvas.getContext('2d');
      ctx.setTransform(6,0,0,6,0,0); ctx.clearRect(0,0,100,100);
      ctx.save(); ctx.translate(35.2,Number(icon.dataset.brandY));
      ctx.fillStyle = getComputedStyle(icon).getPropertyValue('--ex-ink').trim();
      ctx.fill(wordmark,'evenodd'); ctx.restore();
    });
  }
  function changed() {
    render();
    window.openai?.setWidgetState?.({ privateContent: { ...state }, modelContent: { explorerAccent: state.accent } }).catch(() => {});
  }
  render();
  window.addEventListener('openai:set_globals',event => { restore(event.detail?.globals?.widgetState?.privateContent); render(); });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: changed });
    tweak.addColorPicker(state,'accent',{ label: 'Explorer accent', reference: '--ex-amber' });
  }
})();
</script>
