<style>
  #kd-explorer-open-folder { color-scheme: light dark; }
  #kd-explorer-open-folder .ex-board {
    --ex-stage: light-dark(#edf2f6,#1e2630); --ex-text: light-dark(#24394b,#e9f0f7);
    --ex-muted: light-dark(#53687b,#b1c2d2); --ex-rule: light-dark(#cfdbe5,#3d4d5d);
    background: var(--ex-stage); color: var(--ex-text); border-radius: 22px; padding: 24px 28px;
    font: 14px/1.5 ui-sans-serif,system-ui,sans-serif; box-sizing: border-box;
  }
  #kd-explorer-open-folder .ex-heading { min-height: 60px; padding-right: 90px; }
  #kd-explorer-open-folder h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.025em; }
  #kd-explorer-open-folder .ex-subtitle { margin-top: 4px; color: var(--ex-muted); font-size: 12px; }
  #kd-explorer-open-folder .ex-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 22px 0 24px; }
  #kd-explorer-open-folder figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  #kd-explorer-open-folder figcaption { color: var(--ex-muted); font-size: 12px; }
  #kd-explorer-open-folder .ex-icon {
    --ex-base: #fff; --ex-amber: #e5af4b; --ex-bright: #f9d68f; --ex-deep: #bb822a;
    --ex-ink: #604718; --ex-paper: #fff; --ex-paper-edge: #dfe6eb;
    --ex-metal: #b6c5cf; --ex-metal-light: #f9fcfd; --ex-metal-dark: #7f929f;
    --ex-outline: #1a1a1a61; --ex-line: #9caab3;
    --ex-ramp: linear-gradient(135deg,var(--ex-bright),var(--ex-amber) 30% 76%,var(--ex-deep));
    --ex-metal-ramp: linear-gradient(135deg,var(--ex-metal-light),var(--ex-metal) 34% 76%,var(--ex-metal-dark));
    width: 1em; height: 1em; font-size: 180px; position: relative; overflow: hidden;
    background: var(--ex-base); isolation: isolate; flex: 0 0 auto;
  }
  #kd-explorer-open-folder .ex-icon[data-mode="dark"] {
    --ex-base: #1a1a1a; --ex-amber: #efc26b; --ex-bright: #ffe3ab; --ex-deep: #c49342;
    --ex-ink: #62491e; --ex-paper-edge: #cbd5de;
    --ex-metal: #d1dde6; --ex-metal-light: #fff; --ex-metal-dark: #a2b2be;
    --ex-outline: #ffffff75;
  }
  #kd-explorer-open-folder .ex-art { position: absolute; inset: 0; transform: none; filter: drop-shadow(.004em 0 0 var(--ex-outline)) drop-shadow(-.004em 0 0 var(--ex-outline)) drop-shadow(0 .004em 0 var(--ex-outline)) drop-shadow(0 -.004em 0 var(--ex-outline)); }
  #kd-explorer-open-folder .ex-art * { position: absolute; box-sizing: border-box; }
  #kd-explorer-open-folder .ex-tab { left: 17%; top: 23%; width: 29%; height: 17%; border-radius: .035em .035em 0 0; background: linear-gradient(135deg,var(--ex-bright),var(--ex-amber)); }
  #kd-explorer-open-folder .ex-back { left: 17%; top: 31%; width: 66%; height: 47%; border-radius: .035em; background: linear-gradient(135deg,var(--ex-amber),var(--ex-deep)); box-shadow: inset .008em .008em 0 #fff8; }
  #kd-explorer-open-folder .ex-front { left: 17%; top: 38%; width: 66%; height: 40%; border-radius: .035em; background: var(--ex-ramp); box-shadow: inset .008em .012em 0 #fff8,inset -.008em -.012em 0 #79541726; }
  #kd-explorer-open-folder .ex-lip { left: 22%; top: 38%; width: 56%; height: 1.1%; border-radius: .01em; background: #fff8; }
  #kd-explorer-open-folder .ex-brand { inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #kd-explorer-open-folder .ex-paper { left: 28%; top: 27%; width: 45%; height: 42%; background: linear-gradient(135deg,var(--ex-paper) 70%,var(--ex-paper-edge)); border-radius: .025em; transform: rotate(7deg); box-shadow: -.012em .012em .012em #27343c26; }
  #kd-explorer-open-folder .ex-paper.back { left: 24%; top: 23%; transform: rotate(-5deg); }
  #kd-explorer-open-folder .ex-paper::before { content: ''; position: absolute; left: 16%; top: 18%; width: 55%; height: 4%; border-radius: .01em; background: var(--ex-line); box-shadow: 0 .05em 0 var(--ex-line),0 .1em 0 var(--ex-line); opacity: .6; }
  #kd-explorer-open-folder .ex-open .ex-back { top: 30%; height: 49%; }
  #kd-explorer-open-folder .ex-open .ex-tab { top: 22%; box-shadow: inset .008em .008em 0 #fff8; }
  #kd-explorer-open-folder .ex-open .ex-paper { left: 32%; top: 27%; width: 42%; transform: rotate(6deg); }
  #kd-explorer-open-folder .ex-open .ex-paper.back { left: 25%; top: 25%; transform: rotate(-7deg); }
  #kd-explorer-open-folder .ex-open .ex-front { left: 12%; top: 43%; width: 76%; height: 37%; clip-path: polygon(0 0,100% 0,93% 100%,7% 100%); border-radius: .025em; }
  #kd-explorer-open-folder .ex-open .ex-front::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: 1.5%; height: 1.8%; background: var(--ex-deep); opacity: .45; border-radius: .01em; }
  #kd-explorer-open-folder .ex-open .ex-lip { left: 14%; top: 43.3%; width: 72%; height: .9%; background: linear-gradient(90deg,#fff3,#fffb 20%,#fff8 75%,#fff3); }
  #kd-explorer-open-folder .ex-crops { display: grid; grid-template-columns: 88px 1fr 1fr; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--ex-rule); }
  #kd-explorer-open-folder .ex-crops > span { color: var(--ex-muted); font-size: 12px; }
  #kd-explorer-open-folder .ex-slot { display: flex; justify-content: center; }
  #kd-explorer-open-folder .ex-slot .ex-icon { font-size: 56px; }
  #kd-explorer-open-folder .ex-squircle { clip-path: polygon(0% 30%,.4% 20%,1.5% 12%,4% 6%,8% 2.5%,15% .5%,30% 0%,70% 0%,85% .5%,92% 2.5%,96% 6%,98.5% 12%,99.6% 20%,100% 30%,100% 70%,99.6% 80%,98.5% 88%,96% 94%,92% 97.5%,85% 99.5%,70% 100%,30% 100%,15% 99.5%,8% 97.5%,4% 94%,1.5% 88%,.4% 80%,0% 70%); }
  #kd-explorer-open-folder .ex-rounded { clip-path: inset(0 round 22%); }
  #kd-explorer-open-folder .ex-circle { clip-path: circle(50%); }
  @media(max-width:480px) {
    #kd-explorer-open-folder .ex-board { padding: 22px 16px; }
    #kd-explorer-open-folder .ex-heading { min-height: 110px; }
    #kd-explorer-open-folder .ex-pair { gap: 16px; }
    #kd-explorer-open-folder .ex-pair .ex-icon { font-size: min(160px,33vw); }
    #kd-explorer-open-folder .ex-crops { grid-template-columns: 76px 1fr 1fr; gap: 12px 6px; }
    #kd-explorer-open-folder .ex-slot .ex-icon { font-size: 48px; }
  }
</style>
<div id="kd-explorer-open-folder" aria-label="KD Explorer open-folder refinement">
  <div class="viz-dotted-background" aria-label="KD Explorer open-folder refinement">
    <section data-variant="Open folder" aria-label="Open folder KD Explorer logo">
      <div class="ex-board">
        <header class="ex-heading"><h2>Open folder</h2><div class="ex-subtitle">Upright folder · fanned papers</div></header>
        <div class="ex-pair">
          <figure><div class="ex-icon ex-open" data-mode="light" data-brand-y="54" role="img" aria-label="Light KD Explorer logo: an open amber folder holding two white sheets with centered KD on its level front"><div class="ex-art"><div class="ex-tab"></div><div class="ex-back"></div><div class="ex-paper back"></div><div class="ex-paper"></div><div class="ex-front"></div><div class="ex-lip"></div><canvas class="ex-brand" width="600" height="600" aria-hidden="true"></canvas></div></div><figcaption>Light</figcaption></figure>
          <figure><div class="ex-icon ex-open" data-mode="dark" data-brand-y="54" role="img" aria-label="Dark open-folder KD Explorer logo"></div><figcaption>Dark</figcaption></figure>
        </div>
        <div class="ex-crops" aria-label="Open folder crop previews"></div>
      </div>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('kd-explorer-open-folder');
  const state = { accent: '#e5af4b' };
  function restore(saved) {
    if (/^#[0-9a-f]{6}$/i.test(saved?.accent || '')) state.accent = saved.accent;
  }
  restore(window.openai?.widgetState?.privateContent);
  root.querySelectorAll('.ex-board').forEach(board => {
    const original = board.querySelector('.ex-pair [data-mode="light"]');
    board.querySelector('.ex-pair [data-mode="dark"]').innerHTML = original.innerHTML;
    const crops = board.querySelector('.ex-crops');
    [['Squircle','squircle'],['Rounded','rounded'],['Circle','circle']].forEach(([label,mask]) => {
      const name = document.createElement('span'); name.textContent = label; crops.appendChild(name);
      ['light','dark'].forEach(mode => {
        const slot = document.createElement('div'); slot.className = 'ex-slot';
        const icon = original.cloneNode(true); icon.dataset.mode = mode; icon.classList.add('ex-' + mask);
        icon.setAttribute('aria-label',board.querySelector('h2').textContent + ', ' + mode + ', ' + label + ' crop');
        slot.appendChild(icon); crops.appendChild(slot);
      });
    });
  });
  const wordmark = new Path2D('M0,0H3.6V6.2L8.8,0H13.3L6.9,7.4L13.8,16H9.2L3.6,9V16H0ZM14.5,0H20.6C26.1,0 29.6,3 29.6,8C29.6,13 26.1,16 20.6,16H14.5ZM18.1,3.3V12.7H20.4C23.9,12.7 25.8,11.1 25.8,8C25.8,4.9 23.9,3.3 20.4,3.3Z');
  function render() {
    root.querySelectorAll('.ex-icon').forEach(icon => {
      const dark = icon.dataset.mode === 'dark';
      const mix = (color,ratio) => `color-mix(in srgb, ${state.accent} ${ratio}%, ${color})`;
      icon.style.setProperty('--ex-amber',dark ? mix('white',78) : state.accent);
      icon.style.setProperty('--ex-bright',mix('white',dark ? 42 : 58));
      icon.style.setProperty('--ex-deep',mix(dark ? 'white' : 'black',dark ? 95 : 78));
      const canvas = icon.querySelector('.ex-brand'); const ctx = canvas.getContext('2d');
      ctx.setTransform(6,0,0,6,0,0); ctx.clearRect(0,0,100,100);
      ctx.save(); ctx.translate(35.2,Number(icon.dataset.brandY));
      ctx.fillStyle = getComputedStyle(icon).getPropertyValue('--ex-ink').trim();
      ctx.fill(wordmark,'evenodd'); ctx.restore();
    });
  }
  function changed() {
    render();
    window.openai?.setWidgetState?.({ privateContent: { ...state }, modelContent: { explorerAccent: state.accent } }).catch(() => {});
  }
  render();
  window.addEventListener('openai:set_globals',event => { restore(event.detail?.globals?.widgetState?.privateContent); render(); });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: changed });
    tweak.addColorPicker(state,'accent',{ label: 'Explorer accent', reference: '--ex-amber' });
  }
})();
</script>
